<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}}</title>
    <meta name="description" content="{{description}}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,650;1,8..60,400&display=swap"
    />
    <link rel="stylesheet" href="{{root}}site.css" />
  </head>
  <body>
    <header class="frame masthead">
      <a class="wordmark" href="{{root}}">Gutterpress <small>Markdown &amp; CSS, typeset for print</small></a>
      <nav aria-label="Site">
        <ul class="nav">
          <li><a href="https://github.com/dimm-city/gutterpress/releases/latest">Download</a></li>
          <li><a href="https://github.com/dimm-city/gutterpress/tree/main/examples/gutterpress-user-guide">User guide</a></li>
          <li><a href="https://github.com/dimm-city/gutterpress/blob/main/packages/cli/README.md">CLI</a></li>
          <li><a href="{{root}}privacy/"{{privacy-current}}>Privacy</a></li>
          <li><a href="https://github.com/dimm-city/gutterpress">GitHub</a></li>
        </ul>
      </nav>
    </header>

    <main class="frame">
      <article class="prose">
{{content}}
      </article>
    </main>

    <footer class="frame colophon">
      <span>Gutterpress is open source, by <a href="https://github.com/dimm-city">Dimm City</a>.</span>
      <span>
        <a href="{{root}}privacy/">Privacy policy</a> ·
        <a href="https://github.com/dimm-city/gutterpress/blob/main/CHANGELOG.md">Changelog</a> ·
        <a href="https://github.com/dimm-city/gutterpress/issues">Issues</a>
      </span>
    </footer>
  </body>
</html>
