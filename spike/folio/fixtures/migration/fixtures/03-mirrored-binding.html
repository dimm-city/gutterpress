<!doctype html>
<meta charset="utf-8" />
<title>fixture 03 — named pages, :left/:right mirroring, binding margin</title>
<style>
  /* the A1 defect: a book with a binding offset needs the INNER margin (the
     one nearest the spine) to be wider on both recto and verso, mirrored —
     not the same margin on every page. Outer 0.625in, inner 0.875in: a
     0.25in binding offset. */
  @page { size: 5in 7.5in; margin: 0.75in; }
  @page chapter {
    margin-top: 0.75in;
    margin-bottom: 0.75in;
    margin-left: 0.625in;
    margin-right: 0.875in;
    @bottom-center { content: counter(page); font-size: 9pt; }
  }
  @page chapter:left  { margin-left: 0.875in; margin-right: 0.625in; }
  @page chapter:right { margin-left: 0.625in; margin-right: 0.875in; }
  html { font: 11pt/1.4 'DejaVu Serif', Georgia, serif; }
  body { margin: 0; }
  main { page: chapter; }
  p { margin: 0 0 8pt; }
  h1 { font-size: 14pt; break-before: page; margin: 0 0 8pt; }
  /* CSS class, not an inline `style=` attribute: Paged.js's polisher reads
     break-before/after only from stylesheet rules, not inline style="" — an
     inline break is honored by native Chromium print but silently ignored by
     Paged.js (measured while building this fixture: content collapsed onto
     one page). Author-facing implication, not just a test-authoring detail. */
  .brk { break-before: page; }
</style>
<body>
  <main>
    <h1>Binding test</h1>
    <p>SENTINEL-BIND-01 first page of the run.</p>
    <p>SENTINEL-BIND-02 filler to keep the page from collapsing to a stub so the margin box still has room to render its folio.</p>
    <div class="brk"><p>SENTINEL-BIND-03 second page.</p></div>
    <div class="brk"><p>SENTINEL-BIND-04 third page.</p></div>
    <div class="brk"><p>SENTINEL-BIND-05 fourth page.</p></div>
    <div class="brk"><p>SENTINEL-BIND-06 fifth page.</p></div>
  </main>
</body>
