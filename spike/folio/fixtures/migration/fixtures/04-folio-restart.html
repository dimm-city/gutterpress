<!doctype html>
<meta charset="utf-8" />
<title>fixture 04 — front-matter to body folio restart</title>
<style>
  /* the known Folio gap (ENGINE.md §8, MIGRATION.md "Current state of the two
     known Folio gaps" #1): `counter-reset: page 1` on a NORMAL element does
     NOT restart counter(page) in native Chromium print (measured in
     isolation while building this fixture — see runner.ts/README.md).
     THIS fixture pairs the counter-reset with a page-NAME change
     (`page: body-main`) on the SAME element, because that is what the
     compiler's planned synthesis actually emits (a generated page name is
     how the counter-style-map mechanism works at all).
     CORRECTED (F6, measured twice — see README.md "Fixture 4"): pairing the
     reset with a page-name change does NOT restart the counter natively
     either. Plain Chromium print of this exact document reads
     i, ii, iii, 4, 5, 6 — the reset is still ignored. Folio's PDF reads
     i, ii, iii, 1, 2, 3 correctly, but ONLY because
     `model.counterResets.length > 0` forces the compiler down its tier-3
     measure→synthesize→fixpoint path (`src/compiler/build.ts`), whose
     `pageCounterValues`/`counterStyleCss` machinery computes and injects the
     restart itself. That is real synthesis, not a native restart earned by
     the pairing — do not read this fixture's PASS as evidence the pairing
     works "for free". The isolated ENGINE.md §8 case (reset with no name
     change) still fails natively too. Both are asserted below. */
  @page {
    size: 5in 7.5in;
    margin: 0.75in;
  }
  @page front { @bottom-center { content: counter(page, lower-roman); font-size: 9pt; } }
  @page body-main { @bottom-center { content: counter(page); font-size: 9pt; } }
  .front { page: front; }
  .body-main { page: body-main; }
  .page-chapter-start { page: body-main; counter-reset: page 1; }
  html { font: 11pt/1.4 'DejaVu Serif', Georgia, serif; }
  body { margin: 0; }
  p { margin: 0 0 8pt; }
  h1 { font-size: 14pt; margin: 0 0 8pt; }
  /* CSS class, not inline style="" — Paged.js's polisher reads break-before
     only from stylesheet rules (measured while building fixture 03: an
     inline break is silently ignored by Paged.js, honored by native
     Chromium print). */
  .brk { break-before: page; }
</style>
<body>
  <main>
    <section class="front"><p>SENTINEL-FRONT-i title page.</p></section>
    <section class="front brk"><p>SENTINEL-FRONT-ii copyright page.</p></section>
    <section class="front brk"><p>SENTINEL-FRONT-iii table of contents.</p></section>
    <section class="page-chapter-start brk">
      <h1>Chapter One</h1>
      <p>SENTINEL-BODY-1 the body must fold back to arabic 1, not continue at roman iv / arabic 4.</p>
    </section>
    <section class="brk body-main"><p>SENTINEL-BODY-2 second body page.</p></section>
    <section class="brk body-main"><p>SENTINEL-BODY-3 third body page.</p></section>
  </main>
</body>
