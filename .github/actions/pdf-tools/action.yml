name: Install PDF tooling (cached)
description: >-
  Install Ghostscript and qpdf from apt, keeping the downloaded packages in the
  Actions cache so a slow mirror is paid once per runner image, not on every run
  (#414). apt also retries a fetch that fails part-way.
runs:
  using: composite
  steps:
    # apt is told to keep its downloads in a directory the runner user owns, so
    # actions/cache can save and restore them; apt verifies every cached .deb
    # against the index, so a stale one is simply downloaded again.
    - name: Restore the apt package cache
      uses: actions/cache@v5
      with:
        path: ~/apt-archives/*.deb
        key: pdf-tools-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageVersion }}
        restore-keys: |
          pdf-tools-${{ runner.os }}-${{ runner.arch }}-
    - name: Install Ghostscript and qpdf
      shell: bash
      run: |
        mkdir -p "$HOME/apt-archives/partial"
        sudo apt-get update
        sudo apt-get install -y -o Acquire::Retries=3 -o "Dir::Cache::archives=$HOME/apt-archives" ghostscript qpdf
        sudo chown -R "$(id -u):$(id -g)" "$HOME/apt-archives"
