name: Install PDF tooling (offline on cache hits)
description: >-
  Cache the complete apt package set for this runner image and install it
  without network access on warm runs. Ghostscript must be 10.03 or newer:
  pdfwrite in older versions ignores the PDF/X output profile and separates
  through its default CMYK profile (Artifex bug 707350, fixed in 10.03.0).
  Ubuntu 24.04's package is 10.02.1, so the jobs that use this action run on
  Ubuntu 26.04 (10.06.0); the verify step fails on an older gs.
runs:
  using: composite
  steps:
    - name: Read the runner image version
      id: image
      shell: bash
      run: echo "version=${ImageVersion:?GitHub runner image version is required}" >> "$GITHUB_OUTPUT"
    - name: Restore PDF tool packages
      id: cache
      uses: actions/cache/restore@v5
      with:
        path: ~/apt-archives/*.deb
        # Only an exact image match is safe for offline dependency installation.
        key: pdf-tools-${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.version }}-${{ hashFiles('.github/actions/pdf-tools/action.yml') }}
    - name: Install cached packages offline
      if: steps.cache.outputs.cache-hit == 'true'
      shell: bash
      run: sudo dpkg -i "$HOME"/apt-archives/*.deb
    - name: Download and install PDF tools
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p "$HOME/apt-archives/partial"
        sudo timeout 180 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::Languages=none update
        sudo timeout 180 apt-get install -y -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o "Dir::Cache::archives=$HOME/apt-archives" ghostscript qpdf poppler-utils
        sudo chown -R "$(id -u):$(id -g)" "$HOME/apt-archives"
    - name: Verify PDF tools
      shell: bash
      run: |
        gs --version
        dpkg --compare-versions "$(gs --version)" ge 10.03 || { echo "Ghostscript $(gs --version) is older than 10.03: pdfwrite ignores the PDF/X output profile (Artifex bug 707350)"; exit 1; }
        qpdf --version
        pdftoppm -v
    # Save after setup, so a later test failure does not discard the download.
    - uses: actions/cache/save@v5
      if: steps.cache.outputs.cache-hit != 'true'
      with:
        path: ~/apt-archives/*.deb
        key: ${{ steps.cache.outputs.cache-primary-key }}
