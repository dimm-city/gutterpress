name: Setup Bun (cached)
description: Install Bun and restore the global dependency install cache keyed on bun.lock.
inputs:
  bun-version:
    description: "Bun version to install"
    required: false
    default: "1.3.14"
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}
    - uses: actions/cache@v5
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
        restore-keys: |
          bun-${{ runner.os }}-
