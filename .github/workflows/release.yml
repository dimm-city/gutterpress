name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.2.3 or 1.2.3-beta.1). Bumps package.json, builds all artifacts, verifies on Windows, then creates a GitHub release."
        required: true
        type: string
      skip_npm_publish:
        description: "Skip publishing to npm (useful for pre-releases or testing the workflow)"
        required: false
        type: boolean
        default: false

env:
  PUPPETEER_SKIP_DOWNLOAD: 'true'
  PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── 1. Gate ────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun --filter '*' test

  # ── 2. Version bump & tag ─────────────────────────────────────────────────
  version:
    name: Bump Version & Tag
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Ensure workflow runs from default branch
        if: ${{ github.ref_name != github.event.repository.default_branch }}
        run: |
          echo "Releases must be dispatched from ${{ github.event.repository.default_branch }}."
          exit 1

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Bump version in package.json
        run: |
          VERSION="${{ inputs.version }}"
          VERSION="$VERSION" node -e "
            const fs = require('fs');
            for (const pkg of ['packages/cli/package.json', 'packages/lib/package.json', 'packages/viewer/package.json']) {
              const p = JSON.parse(fs.readFileSync(pkg, 'utf8'));
              p.version = process.env.VERSION;
              fs.writeFileSync(pkg, JSON.stringify(p, null, 2) + '\n');
            }
          "

      - name: Commit and tag
        id: tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/cli/package.json packages/lib/package.json packages/viewer/package.json

          if ! git diff --cached --quiet; then
            git commit -m "chore: bump version to ${{ inputs.version }}"
            git push
          fi

          if git rev-parse -q --verify "refs/tags/v${{ inputs.version }}" >/dev/null; then
            git tag -d "v${{ inputs.version }}"
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/v${{ inputs.version }}" >/dev/null; then
            git push origin ":refs/tags/v${{ inputs.version }}"
          fi

          git tag "v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"
          echo "tag=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"

  # ── 3. Build all artifacts in parallel ────────────────────────────────────
  #
  # All three jobs fan out from `version` simultaneously:
  #   build-cli          — 5 CLI binaries via Bun cross-compile (ubuntu)
  #   build-viewer-linux — AppImage + Windows zip (ubuntu)
  #   build-viewer-mac   — macOS DMG (macos — cannot cross-compile)
  #
  # All artifacts are uploaded as GitHub Actions artifacts and assembled
  # into the GitHub Release in one shot by the `github-release` job.

  build-cli:
    name: CLI / ${{ matrix.artifact }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64
            artifact: print-md-cli-linux-x64
          - target: bun-linux-arm64
            artifact: print-md-cli-linux-arm64
          - target: bun-darwin-x64
            artifact: print-md-cli-macos-x64
          - target: bun-darwin-arm64
            artifact: print-md-cli-macos-arm64
          - target: bun-windows-x64
            artifact: print-md-cli-windows-x64.exe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build standalone binary
        run: bun --cwd packages/cli scripts/compile.ts ${{ matrix.target }} ../../${{ matrix.artifact }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  build-viewer-linux:
    name: Viewer / Linux AppImage
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build lib dist
        run: bun run build
        working-directory: packages/lib

      - name: Build Linux AppImage
        working-directory: packages/viewer
        run: npm run dist:linux

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: viewer-linux
          path: packages/viewer/dist/*.AppImage
          if-no-files-found: error

  build-viewer-windows:
    name: Viewer / Windows zip
    needs: version
    # electron-builder handles Electron download, exe rename, icon embedding, zip.
    # afterPack hook uses npm install (no Bun required at packaging time).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build lib dist
        run: bun run build
        working-directory: packages/lib

      - name: Build Windows zip
        working-directory: packages/viewer
        run: npm run dist:win

      - name: Upload Windows zip
        uses: actions/upload-artifact@v4
        with:
          name: viewer-windows
          # electron-builder default for `--win zip` is
          # ${productName}-${version}-win.zip
          path: packages/viewer/dist/*-win.zip
          if-no-files-found: error

  build-viewer-mac:
    name: Viewer / macOS DMG
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Patch viewer version
        run: |
          VERSION="${{ inputs.version }}"
          jq --arg v "$VERSION" '.version = $v' packages/viewer/package.json > /tmp/viewer-pkg.json
          mv /tmp/viewer-pkg.json packages/viewer/package.json

      - name: Install Xcode command-line tools
        run: xcode-select --install || true

      - name: Build lib dist
        run: bun run build
        working-directory: packages/lib

      - name: Build macOS DMG
        working-directory: packages/viewer
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: viewer-mac
          path: packages/viewer/dist/*.dmg
          if-no-files-found: error

  # ── 4. Verify on real Windows ────────────────────────────────────────────
  #
  # Runs the CLI binary and install script on windows-latest to catch any
  # binary compatibility issues before publishing the release.

  verify-windows:
    name: Verify Windows binary (render smoke)
    # Runs as soon as build-cli finishes — does not wait on the viewer
    # Windows build so the two windows-latest jobs run in parallel.
    needs: [version, build-cli]
    uses: ./.github/workflows/windows-install-test.yml
    with:
      script_ref: ${{ needs.version.outputs.tag }}
      use_artifact: true

  # ── 5. Publish to npm (skippable) ─────────────────────────────────────────
  publish-npm:
    name: Publish to npm
    needs: [version, verify-windows]
    if: ${{ !inputs.skip_npm_publish && needs.verify-windows.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build lib dist
        run: bun run build
        working-directory: packages/lib

      - name: Skip if already published
        run: |
          if npm view "@dimm-city/print-md@${{ inputs.version }}" version &>/dev/null; then
            echo "Version ${{ inputs.version }} already published — skipping."
            echo "ALREADY_PUBLISHED=true" >> "$GITHUB_ENV"
          fi

      - name: Publish to npm
        if: ${{ env.ALREADY_PUBLISHED != 'true' }}
        working-directory: packages/cli
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ── 6. Create release with ALL artifacts ──────────────────────────────────
  #
  # Waits for every build job and the Windows verify before creating the
  # release. Users see a complete release — no partial-artifact window.

  github-release:
    name: Create GitHub Release
    needs:
      - version
      - build-cli
      - build-viewer-linux
      - build-viewer-windows
      - build-viewer-mac
      - verify-windows
      - publish-npm
    if: |
      always() &&
      needs.version.result == 'success' &&
      needs.build-cli.result == 'success' &&
      needs.build-viewer-linux.result == 'success' &&
      needs.build-viewer-windows.result == 'success' &&
      needs.build-viewer-mac.result == 'success' &&
      needs.verify-windows.result == 'success' &&
      (needs.publish-npm.result == 'success' || needs.publish-npm.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Create GitHub release
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          REPO="${{ github.repository }}"

          PRERELEASE_FLAG=""
          if [[ "${{ inputs.version }}" == *"-"* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          # Delete any existing release for this tag (could be a stub left
          # over from an earlier failed run). The tag itself is kept — the
          # version job already pointed it at the current commit.
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Deleting existing release $TAG to recreate with current artifacts..."
            gh release delete "$TAG" --yes --repo "$REPO"
          fi

          gh release create "$TAG" \
            --repo "$REPO" \
            --title "print-md $TAG" \
            --generate-notes \
            $PRERELEASE_FLAG \
            dist/*
        env:
          GH_TOKEN: ${{ github.token }}
