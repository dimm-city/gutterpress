name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release: 1.2.3 (stable), 1.2.3-beta.1, or 1.2.3-alpha.1. Only alpha/beta prerelease suffixes are accepted — they are the app's update channels (electron-updater treats anything else, e.g. rc, as a custom channel that strands its users). Stable releases must be dispatched from the default branch; prereleases may ALSO be dispatched from a release/* branch. Bumps package.json, builds all artifacts, verifies on Windows, then creates a GitHub release."
        required: true
        type: string
      skip_npm_publish:
        description: "Skip publishing to npm. Default false — npm publishes via OIDC trusted publishing. Set true only to intentionally hold back the npm release."
        required: false
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

env:
  PUPPETEER_SKIP_DOWNLOAD: 'true'
  PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
  # GitHub App client id for the device-flow auth (ADR 0006 D1). Public by
  # design (not a secret). The viewer's electron-vite define bakes it into the
  # packaged main process; the lib also carries it as an in-code default, so
  # this env override only matters if the registration is ever rotated.
  PRINT_MD_GITHUB_CLIENT_ID: ${{ vars.PRINT_MD_GITHUB_CLIENT_ID }}

jobs:
  # ── 1. Gate ────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      # Test the branch the release is dispatched from (default branch for a
      # stable release, or a release/* branch for a prerelease).
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Setup Bun (cached)
        uses: ./.github/actions/bun

      - name: Install dependencies
        run: bun install

      - name: Configure Puppeteer to use system Chrome
        run: |
          echo "PUPPETEER_EXECUTABLE_PATH=$(which google-chrome-stable)" >> $GITHUB_ENV

      # The viewer suite imports @dimm-city/print-md by name (resolves to its
      # built dist/), so build the package before running all-package tests.
      - name: Build package dist
        run: bun run build
        working-directory: packages/cli

      - name: Run tests
        run: bun --filter '*' test

  # ── 2. Version bump & tag ─────────────────────────────────────────────────
  version:
    name: Bump Version & Tag
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    env:
      VERSION: ${{ inputs.version }}
    steps:
      # Stable releases come from the default branch. PRERELEASE versions (the
      # version string contains a '-', e.g. 0.4.0-beta.1) may also be cut from a
      # release/* branch, so a release line can ship betas to testers before it
      # merges to the default branch. Anything else is rejected.
      #
      # Prerelease suffixes are restricted to -alpha.N / -beta.N: those are the
      # app's update channels. electron-updater hardcodes alpha/beta as its
      # known channels — any other suffix (rc included) is a "custom channel"
      # whose users are only ever offered releases with that exact suffix, so
      # they'd never see the stable release that follows.
      - name: Validate dispatch branch and version
        env:
          BRANCH: ${{ github.ref_name }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          # Normalize: strip any leading non-semver prefix such as "print-md v" or bare "v"
          # so dispatching "print-md v0.7.1-beta.2" or "v1.2.3" behaves the same as "0.7.1-beta.2".
          VERSION="$(echo "$VERSION" | sed -E 's/^[^0-9]*([0-9])/\1/')"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta)\.[0-9]+)?$ ]]; then
            echo "::error::Invalid version: $VERSION (expected 1.2.3, 1.2.3-beta.1, or 1.2.3-alpha.1 — alpha/beta are the only prerelease channels the app's updater recognizes)"
            exit 1
          fi
          if [ "$BRANCH" = "$DEFAULT" ]; then
            echo "Dispatched from default branch ($BRANCH)."
          elif [[ "$BRANCH" == release/* ]] && echo "$VERSION" | grep -qE '-'; then
            echo "Dispatched from release branch ($BRANCH) with prerelease version ($VERSION)."
          else
            echo "::error::Releases must be dispatched from $DEFAULT, or from a release/* branch with a prerelease version (e.g. 0.4.0-beta.1). Got branch=$BRANCH version=$VERSION"
            exit 1
          fi

      # Check out (and later push the bump commit + tag to) the branch the
      # release was dispatched from — main for stable, release/* for a beta.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      # Finding #44: stable releases must ship with a changelog entry.
      # Alpha/beta dispatches are iteration builds, so their notes can remain
      # under Unreleased until the stable release is cut.
      - name: Verify CHANGELOG.md has an entry for this version
        run: |
          if echo "$VERSION" | grep -q -- '-'; then
            echo "Skipping changelog check for prerelease $VERSION."
            exit 0
          fi

          ESCAPED_VERSION="$(echo "$VERSION" | sed -e 's/\./\\./g')"
          if ! grep -qE "^## \[${ESCAPED_VERSION}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' heading. Add a changelog entry for this release (Keep a Changelog format) before dispatching."
            exit 1
          fi

      - uses: ./.github/actions/bun

      - name: Bump version in package.json
        run: |
          node -e "
            const fs = require('fs');
            for (const pkg of ['packages/cli/package.json', 'packages/viewer/package.json']) {
              const p = JSON.parse(fs.readFileSync(pkg, 'utf8'));
              p.version = process.env.VERSION;
              fs.writeFileSync(pkg, JSON.stringify(p, null, 2) + '\n');
            }
          "

      # Regenerate the lockfile so it stays coherent with the bumped
      # package.json versions — the tag this commit produces is checked out
      # by every downstream build job with `--frozen-lockfile`, which fails
      # if bun.lock is stale relative to the package.json files it describes.
      - name: Update lockfile
        run: bun install

      - name: Commit and tag
        id: tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/cli/package.json packages/viewer/package.json bun.lock

          if ! git diff --cached --quiet; then
            git commit -m "chore: bump version to $VERSION"
            git push
          fi

          # Finding #48: a stable release tag is immutable once pushed —
          # re-dispatching the same stable VERSION must fail loudly instead of
          # silently deleting and re-pointing a tag consumers may already have
          # pulled artifacts against. Only prerelease versions (VERSION
          # contains '-', e.g. 0.4.0-beta.1) may be re-dispatched to let a
          # release/* branch iterate on a beta before it ships stable.
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            if echo "$VERSION" | grep -qE -- '-'; then
              echo "Prerelease v$VERSION already exists on origin — re-dispatch replaces it."
              git push origin ":refs/tags/v$VERSION"
            else
              echo "::error::Tag v$VERSION already exists on origin. Stable release tags are immutable — refusing to re-point it. Dispatch a new version instead."
              exit 1
            fi
          fi

          # Clear any local tag left over so tag creation below is idempotent
          # (should not normally exist on a fresh checkout).
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            git tag -d "v$VERSION"
          fi

          git tag "v$VERSION"
          git push origin "v$VERSION"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

          # A version with a '-' (e.g. 0.4.0-beta.1) is a prerelease: it marks
          # the GitHub release as a pre-release and publishes npm under `next`,
          # not `latest`.
          if echo "$VERSION" | grep -qE '-'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  # ── 3. Build all artifacts in parallel ────────────────────────────────────
  #
  # All four jobs fan out from `version` simultaneously:
  #   build-cli          — 5 CLI binaries via Bun cross-compile (ubuntu)
  #   build-viewer-linux   — Linux AppImage (ubuntu)
  #   build-viewer-windows — Windows installer + portable zip (windows)
  #   build-viewer-mac     — macOS DMG (macos — cannot cross-compile)
  #
  # All artifacts are uploaded as GitHub Actions artifacts and assembled
  # into the GitHub Release in one shot by the `github-release` job.
  #
  # The viewer jobs are UNCONDITIONAL: every GitHub release is the viewer's
  # electron-updater feed, so a release without the installers and the
  # latest.yml / latest-linux.yml feed files breaks update checks for every
  # user whose channel resolves to it (this shipped once, as 0.8.2-rc.1 —
  # the former skip_viewer "RUNTIME release" mode was removed for this).

  build-cli:
    name: CLI / ${{ matrix.artifact }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64
            artifact: print-md-cli-linux-x64
          - target: bun-linux-arm64
            artifact: print-md-cli-linux-arm64
          - target: bun-darwin-x64
            artifact: print-md-cli-macos-x64
          - target: bun-darwin-arm64
            artifact: print-md-cli-macos-arm64
          - target: bun-windows-x64
            artifact: print-md-cli-windows-x64.exe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: ./.github/actions/bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build standalone binary
        working-directory: packages/cli
        run: bun build src/cli.ts --compile --target=${{ matrix.target }} --outfile=../../${{ matrix.artifact }}

      # Smoke test: fail fast if the compiled binary can't even run. Only
      # feasible for linux-x64 since this job runs on ubuntu-latest and can't
      # execute the other targets' binaries.
      - name: Smoke test binary
        if: ${{ matrix.target == 'bun-linux-x64' }}
        run: |
          set -euo pipefail
          chmod +x "${{ matrix.artifact }}"
          "./${{ matrix.artifact }}" --version
          # audit F2: exercise the embedded-assets extraction path — CLAUDE.md
          # flags it as the fragile part of `bun build --compile`, yet the smoke
          # test only ran --version. `new` scaffolds from an embedded template,
          # so a broken extraction fails here instead of shipping. `--dir` is the
          # (existing) parent save location; the project lands in a slug subdir.
          mkdir -p /tmp/pmd-smoke
          "./${{ matrix.artifact }}" new "Smoke Test Book" --dir /tmp/pmd-smoke --template book --no-git
          echo "Scaffolded files:"
          find /tmp/pmd-smoke -maxdepth 3 -type f | sort
          # A scaffolded project must contain at least one markdown file and a
          # manifest — proof the embedded template extracted, not just that the
          # binary ran.
          test -n "$(find /tmp/pmd-smoke -name '*.md' -print -quit)"
          test -n "$(find /tmp/pmd-smoke -name 'manifest.yaml' -print -quit)"

      - name: Upload binary
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  build-viewer-linux:
    name: Viewer / Linux AppImage
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: ./.github/actions/bun

      # audit F3: pin Node to match the Windows viewer build (which pins 22).
      # electron-builder runs under node/npm (see dist:* note below), so leaving
      # this to the runner's ambient default let the three platforms package
      # under different Node majors.
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build package dist
        run: bun run build
        working-directory: packages/cli

      # IMPORTANT: package the viewer with `npm run`, never `bun run`. The
      # `dist:*` scripts invoke electron-builder, which spawns worker processes
      # via `process.execPath`; under Bun that points at the Bun ELF binary and
      # the workers fail (Node can't parse it). Keep electron-builder on
      # node/npm. (See electron-builder.yml `npmRebuild: false` for the related
      # workspace:* guard.)
      - name: Build Linux AppImage
        working-directory: packages/viewer
        run: npm run dist:linux

      # latest-linux.yml + .blockmap are the electron-updater feed files —
      # they must ship on the GitHub release next to the AppImage.
      - name: Upload AppImage
        uses: actions/upload-artifact@v6
        with:
          name: viewer-linux
          path: |
            packages/viewer/dist/*.AppImage
            packages/viewer/dist/*.blockmap
            packages/viewer/dist/latest-linux.yml
          if-no-files-found: error

  build-viewer-windows:
    name: Viewer / Windows installer + zip
    needs: version
    # electron-builder handles Electron download, exe rename, icon embedding, zip.
    # No afterPack hook: the lib ships as a normal node_modules dependency that
    # electron-builder walks automatically (see electron-builder.yml).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: ./.github/actions/bun

      # Finding #62: the composite action is the single Windows-viewer
      # packaging path — also used by viewer-debug-build.yml — so the two
      # never diverge again (it pins node 22, matching the "never bun run"
      # electron-builder/npm constraint documented above).
      - name: Build Windows installer and zip
        uses: ./.github/actions/build-viewer-windows-zip

      # latest.yml + the installer .blockmap are the electron-updater feed —
      # they must ship on the GitHub release next to the installer.
      - name: Upload Windows installer and zip
        uses: actions/upload-artifact@v6
        with:
          name: viewer-windows
          path: |
            packages/viewer/dist/*.exe
            packages/viewer/dist/*.zip
            packages/viewer/dist/*.blockmap
            packages/viewer/dist/latest.yml
          if-no-files-found: error

  build-viewer-mac:
    name: Viewer / macOS DMG
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: ./.github/actions/bun

      # audit F3: pin Node to match the Windows viewer build (see build-viewer-
      # linux for rationale) so all three platforms package under the same Node.
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # No version patch needed — this job checks out the tag the `version`
      # job already bumped and committed (ref: needs.version.outputs.tag).

      - name: Build package dist
        run: bun run build
        working-directory: packages/cli

      - name: Build macOS DMG
        working-directory: packages/viewer
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload DMG
        uses: actions/upload-artifact@v6
        with:
          name: viewer-mac
          path: packages/viewer/dist/*.dmg
          if-no-files-found: error

  # ── 4. Publish to npm (skippable) ─────────────────────────────────────────
  publish-npm:
    name: Publish to npm
    # Finding #48: gate npm on the FULL artifact set, not just build-cli. npm
    # is the one artifact users install unconditionally, so it must never
    # publish a version whose GitHub release could still fail to materialize.
    # Plain `needs` semantics give exactly that: every build job must succeed
    # or this job is skipped (the viewer jobs are unconditional now, so no
    # success-or-skipped special-casing is needed anymore).
    needs:
      [version, build-cli, build-viewer-linux, build-viewer-windows, build-viewer-mac, verify-windows]
    if: ${{ !inputs.skip_npm_publish }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - uses: ./.github/actions/bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # No explicit build step — `npm publish` runs `prepublishOnly: bun run
      # build`, which produces dist/ (bun build + tsc) right before packing.

      # OIDC trusted publishing (no long-lived token) requires npm >= 11.5.1;
      # node 22 ships npm 10.x, so update it. Pinned to a known-good version
      # rather than `latest` to keep the publish step reproducible.
      - name: Update npm for OIDC trusted publishing
        run: npm install -g npm@11.5.2

      - name: Skip if already published
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if npm view "@dimm-city/print-md@$VERSION" version &>/dev/null; then
            echo "Version $VERSION already published — skipping."
            echo "ALREADY_PUBLISHED=true" >> "$GITHUB_ENV"
          fi

      # Pure OIDC trusted publishing — no NODE_AUTH_TOKEN. The id-token: write
      # permission (above) lets npm mint a short-lived credential. Prerequisite:
      # @dimm-city/print-md must be configured as a Trusted Publisher for this
      # repo + workflow on npmjs.com (Settings → Trusted Publishers).
      # Prereleases publish under the `next` dist-tag so `npm install
      # @dimm-city/print-md` (which resolves `latest`) never picks up a beta.
      - name: Publish to npm
        if: ${{ env.ALREADY_PUBLISHED != 'true' }}
        working-directory: packages/cli
        run: |
          if [ "${{ needs.version.outputs.prerelease }}" = "true" ]; then
            npm publish --provenance --access public --tag next
          else
            npm publish --provenance --access public
          fi

  # Docker publish is NOT duplicated here — docker.yml is the single Docker
  # publish path (multi-arch amd64+arm64 GHCR push). It is dispatched
  # explicitly by the github-release job below: its `release: published`
  # trigger can never fire for our releases, because GitHub suppresses
  # workflow-triggering events from anything created with the workflow's own
  # GITHUB_TOKEN (workflow_dispatch is the documented exception, which is why
  # the explicit dispatch works).

  # ── 5b. Verify the Windows CLI binary actually runs ───────────────────────
  # build-cli cross-compiles the Windows binary from ubuntu-latest, so it can
  # only be smoke tested on real Windows. This makes the workflow description
  # ("verifies on Windows") true.
  verify-windows:
    name: Verify Windows binary
    needs: build-cli
    runs-on: windows-latest
    steps:
      - name: Download Windows binary
        uses: actions/download-artifact@v6
        with:
          name: print-md-cli-windows-x64.exe
          path: dist/

      - name: Run --version
        shell: pwsh
        run: |
          & ".\dist\print-md-cli-windows-x64.exe" --version
          if ($LASTEXITCODE -ne 0) {
            Write-Error "print-md-cli-windows-x64.exe --version exited with code $LASTEXITCODE"
            exit 1
          }

  # ── 6. Create release with ALL artifacts ──────────────────────────────────
  #
  # Waits for every build job before creating the release. Users see a complete
  # release — no partial-artifact window.

  github-release:
    name: Create GitHub Release
    needs:
      - version
      - build-cli
      - build-viewer-linux
      - build-viewer-windows
      - build-viewer-mac
      - publish-npm
      - verify-windows
    # `always()` exists ONLY so an intentionally-skipped publish-npm
    # (skip_npm_publish) doesn't skip the release; every build job must have
    # actually succeeded.
    if: |
      always() &&
      needs.version.result == 'success' &&
      needs.build-cli.result == 'success' &&
      needs.verify-windows.result == 'success' &&
      needs.build-viewer-linux.result == 'success' &&
      needs.build-viewer-windows.result == 'success' &&
      needs.build-viewer-mac.result == 'success' &&
      (needs.publish-npm.result == 'success' || needs.publish-npm.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Needed to dispatch docker.yml after the release is created.
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Download CLI artifacts
        uses: actions/download-artifact@v6
        with:
          path: dist/
          merge-multiple: true
          pattern: "print-md-*"

      - name: Download viewer artifacts
        uses: actions/download-artifact@v6
        with:
          path: dist/
          merge-multiple: true
          pattern: "viewer-*"

      # Update-feed integrity gate: every release doubles as the viewer's
      # electron-updater feed, so a missing feed file or installer must fail
      # HERE, loudly — not ship as a release that 404s every update check
      # (the 0.8.2-rc.1 incident). Checks: all named assets exist, the feed
      # files advertise exactly this release's version, and every artifact a
      # feed file references is among the assets being uploaded.
      - name: Verify release assets (update-feed integrity)
        run: |
          set -euo pipefail
          TAG="${{ needs.version.outputs.tag }}"
          VERSION="${TAG#v}"
          ls -l dist/

          missing=0
          for f in \
            print-md-cli-linux-x64 print-md-cli-linux-arm64 \
            print-md-cli-macos-x64 print-md-cli-macos-arm64 \
            print-md-cli-windows-x64.exe \
            latest.yml latest-linux.yml; do
            if [ ! -f "dist/$f" ]; then
              echo "::error::Missing release asset: $f"
              missing=1
            fi
          done
          # The DMG is the manual macOS download channel (no auto-update yet).
          ls dist/*.dmg >/dev/null 2>&1 || { echo "::error::Missing macOS DMG"; missing=1; }
          [ "$missing" -eq 0 ]

          for f in latest.yml latest-linux.yml; do
            feed_version="$(sed -n 's/^version: *//p' "dist/$f" | head -1)"
            if [ "$feed_version" != "$VERSION" ]; then
              echo "::error::dist/$f advertises version '$feed_version' but this release is $VERSION"
              exit 1
            fi
            grep -E '^\s*(- )?(url|path): ' "dist/$f" | sed -E 's/^\s*(- )?(url|path): *//' | sort -u |
              while read -r ref; do
                if [ ! -f "dist/$ref" ]; then
                  echo "::error::dist/$f references '$ref', which is not among the release assets"
                  exit 1
                fi
              done
          done

      - name: Create GitHub release
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          REPO="${{ github.repository }}"

          PRERELEASE_FLAG=""
          if [ "${{ needs.version.outputs.prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          # Finding #48: mirror the tag-immutability check from the `version`
          # job here too. A stable release, once published, must not be
          # silently deleted and recreated. Prereleases may still be
          # re-dispatched (the version job already allowed re-pointing the
          # tag in that case), so a stub release left over from an earlier
          # failed run of the SAME prerelease is replaced deliberately.
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            if [ "${{ needs.version.outputs.prerelease }}" = "true" ]; then
              echo "Prerelease $TAG already has a release — deleting to recreate with current artifacts..."
              gh release delete "$TAG" --yes --repo "$REPO"
            else
              echo "::error::Release $TAG already exists. Stable releases are immutable — refusing to delete and recreate it. Dispatch a new version instead."
              exit 1
            fi
          fi

          gh release create "$TAG" \
            --repo "$REPO" \
            --title "print-md $TAG" \
            --generate-notes \
            $PRERELEASE_FLAG \
            dist/*
        env:
          GH_TOKEN: ${{ github.token }}

      # docker.yml's `release: published` trigger never fires for releases
      # created with GITHUB_TOKEN (GitHub suppresses those events to prevent
      # workflow recursion; workflow_dispatch is exempt), so dispatch it
      # explicitly at the release tag. metadata-action derives the semver
      # image tags from the tag ref; docker.yml applies `latest` only to
      # stable versions dispatched at their matching v<version> tag ref.
      - name: Publish Docker image (dispatch docker.yml at the tag)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ inputs.version }}
        run: |
          gh workflow run docker.yml \
            --repo "${{ github.repository }}" \
            --ref "$TAG" \
            -f tag="$VERSION"
