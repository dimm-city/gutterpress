name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release: 1.2.3 (stable), 1.2.3-beta.1, or 1.2.3-alpha.1. Only alpha/beta prerelease suffixes are accepted — they are the app's update channels (electron-updater treats anything else, e.g. rc, as a custom channel that strands its users). Stable releases must be dispatched from the default branch; prereleases may ALSO be dispatched from a release/* branch. Bumps package.json, builds all artifacts, then creates a GitHub release."
        required: true
        type: string
      skip_npm_publish:
        description: "Skip publishing to npm. Default false — npm publishes via OIDC trusted publishing. Set true only to intentionally hold back the npm release."
        required: false
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

env:
  # GitHub App client id for the device-flow auth (ADR 0006 D1). Public by
  # design (not a secret). The desktop's electron-vite define bakes it into the
  # packaged main process; the lib also carries it as an in-code default, so
  # this env override only matters if the registration is ever rotated.
  GUTTERPRESS_GITHUB_CLIENT_ID: ${{ vars.GUTTERPRESS_GITHUB_CLIENT_ID }}

jobs:
  # ── 1. Gate ────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      # Test the branch the release is dispatched from (default branch for a
      # stable release, or a release/* branch for a prerelease).
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      # Ghostscript rasterises PDFs for the pixel-diff suites, INCLUDING
      # page-background-chromium-bug.canary.test.ts — the expiry trigger that
      # goes red the day Chromium fixes the @page background bug so we delete
      # the workaround instead of entrenching it. Without it those suites
      # silently skip while reporting green; ci-preconditions.test.ts fails
      # the run when Ghostscript is missing, because a skipped removal trigger
      # and a passing one look identical in CI output. Do not remove this step
      # without removing that guard's reason for existing.
      - name: Install PDF tooling (Ghostscript, qpdf)
        run: |
          sudo apt-get update
          sudo apt-get install -y ghostscript qpdf
      - name: Setup Bun (cached)
        uses: ./.github/actions/bun

      # Pinned like ci.yml's six install steps (#286) and the two build jobs
      # below: this job is the gate that authorises a release, so it must test
      # the tree bun.lock describes, not whatever resolves on the day. The
      # `version` job's plain install further down is the deliberate exception,
      # and says so in place.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # NO Chromium pin here, and NO CHROMIUM_PATH override — the engine
      # resolves the runner image's google-chrome-stable, exactly as ci.yml
      # does. A pin would make the release gate reproducible (the 151
      # incident, engine/shared/cdp.ts above REQUIRED_MILESTONE: a Chromium
      # milestone changed Paged Media behaviour with NO error and every
      # cross-reference silently vanished), but #194's Chrome for Testing pin
      # broke every render test the moment it took effect. A pin that lands
      # again must be >= REQUIRED_MILESTONE, have every changed measurement
      # treated as a finding, and be proven by a prerelease dispatch first —
      # release.yml is workflow_dispatch-only, so no PR run will catch a bad
      # pin for you.

      - name: Build package dist
        run: bun run build
        working-directory: packages/cli

      # No GUTTERPRESS_CHROMIUM_ARGS here, to match ci.yml exactly: the
      # runner-image google-chrome-stable needs no sandbox flag. A Chrome for
      # Testing pin WILL need --no-sandbox (it ships no SUID sandbox helper and
      # aborts with "FATAL: No usable sandbox!" under this runner's AppArmor
      # policy, c4be60e) — add the flag only alongside such a pin, never
      # speculatively.
      - name: Run tests
        run: bun --filter '*' test

      - name: Check release distribution tooling and metadata
        run: |
          node tools/prepare-release-assets.test.mjs
          node tools/update-package-managers.test.mjs
          node tools/update-package-managers.mjs --check

  # ── 2. Version bump ───────────────────────────────────────────────────────
  #
  # Bumps package.json + bun.lock and pushes THAT COMMIT only. The tag is
  # created by `github-release` at the very end, once every artifact exists,
  # so a failed run never leaves a tag with no release behind it. A stray
  # bump commit on a failed run is harmless (the next attempt bumps again); a
  # stray tag is not — it is what consumers and `--verify-tag` key on.
  version:
    name: Bump Version
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.tag.outputs.sha }}
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    env:
      VERSION: ${{ inputs.version }}
    steps:
      # Stable releases come from the default branch. PRERELEASE versions (the
      # version string contains a '-', e.g. 0.4.0-beta.1) may also be cut from a
      # release/* branch, so a release line can ship betas to testers before it
      # merges to the default branch. Anything else is rejected.
      #
      # Prerelease suffixes are restricted to -alpha.N / -beta.N: those are the
      # app's update channels. electron-updater hardcodes alpha/beta as its
      # known channels — any other suffix (rc included) is a "custom channel"
      # whose users are only ever offered releases with that exact suffix, so
      # they'd never see the stable release that follows.
      - name: Validate dispatch branch and version
        env:
          BRANCH: ${{ github.ref_name }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          # Accept the conventional optional tag prefix while keeping the
          # release input itself strictly product-neutral.
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta)\.[0-9]+)?$ ]]; then
            echo "::error::Invalid version: $VERSION (expected 1.2.3, 1.2.3-beta.1, or 1.2.3-alpha.1 — alpha/beta are the only prerelease channels the app's updater recognizes)"
            exit 1
          fi
          if [ "$BRANCH" = "$DEFAULT" ]; then
            echo "Dispatched from default branch ($BRANCH)."
          elif [[ "$BRANCH" == release/* ]] && echo "$VERSION" | grep -qE '-'; then
            echo "Dispatched from release branch ($BRANCH) with prerelease version ($VERSION)."
          else
            echo "::error::Releases must be dispatched from $DEFAULT, or from a release/* branch with a prerelease version (e.g. 0.4.0-beta.1). Got branch=$BRANCH version=$VERSION"
            exit 1
          fi

      # Check out (and later push the bump commit to) the branch the release
      # was dispatched from — main for stable, release/* for a beta.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      # A release must ship with a changelog entry.
      #
      # Checked against the BASE version, so `0.10.1-beta.4` looks for
      # `## [0.10.1]` — the same heading the eventual stable cut needs. Running
      # the identical check on every prerelease means the stable dispatch —
      # the one release that cannot be re-cut at the same version, because its
      # tag is immutable — is never the check's first real execution.
      - name: Verify CHANGELOG.md has an entry for this version
        run: |
          BASE_VERSION="${VERSION%%-*}"
          ESCAPED_VERSION="$(echo "$BASE_VERSION" | sed -e 's/\./\\./g')"
          if ! grep -qE "^## \[${ESCAPED_VERSION}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$BASE_VERSION]' heading. Add a changelog entry for this release (Keep a Changelog format) before dispatching — head the section when you cut the first prerelease, not at the stable cut."
            exit 1
          fi

      - uses: ./.github/actions/bun

      - name: Bump version in package.json
        run: |
          node -e "
            const fs = require('fs');
            for (const pkg of ['packages/cli/package.json', 'packages/desktop/package.json']) {
              const p = JSON.parse(fs.readFileSync(pkg, 'utf8'));
              p.version = process.env.VERSION;
              fs.writeFileSync(pkg, JSON.stringify(p, null, 2) + '\n');
            }
          "

      # Regenerate the lockfile so it stays coherent with the bumped
      # package.json versions — the tag this commit produces is checked out
      # by every downstream build job with `--frozen-lockfile`, which fails
      # if bun.lock is stale relative to the package.json files it describes.
      - name: Update lockfile
        run: bun install

      - name: Commit the bump
        id: tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/cli/package.json packages/desktop/package.json bun.lock

          if ! git diff --cached --quiet; then
            git commit -m "chore: bump version to $VERSION"
            git push
          fi

          # Checked EARLY so a stable re-dispatch fails before
          # any build runs: a stable release tag is immutable once pushed —
          # re-dispatching the same stable VERSION must fail loudly instead of
          # silently deleting and re-pointing a tag consumers may already have
          # pulled artifacts against. Only prerelease versions (VERSION
          # contains '-', e.g. 0.4.0-beta.1) may be re-dispatched to let a
          # release/* branch iterate on a beta before it ships stable; the
          # github-release job re-points such a tag when it creates it.
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            if echo "$VERSION" | grep -qE -- '-'; then
              echo "Prerelease v$VERSION already exists on origin — the release job will re-point it."
            else
              echo "::error::Tag v$VERSION already exists on origin. Stable release tags are immutable — refusing to re-point it. Dispatch a new version instead."
              exit 1
            fi
          fi

          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # A version with a '-' (e.g. 0.4.0-beta.1) is a prerelease: it marks
          # the GitHub release as a pre-release and publishes npm under `next`,
          # not `latest`.
          if echo "$VERSION" | grep -qE '-'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  # ── 3. Build all artifacts in parallel ────────────────────────────────────
  #
  # All four jobs fan out from `version` simultaneously:
  #   build-cli          — 5 CLI binaries via Bun cross-compile (ubuntu)
  #   build-desktop-linux   — Linux AppImage (ubuntu)
  #   build-desktop-windows — Windows installer + portable zip (windows)
  #   build-desktop-mac     — macOS Intel + Apple Silicon DMGs (macos)
  #
  # All artifacts are uploaded as GitHub Actions artifacts and assembled
  # into the GitHub Release in one shot by the `github-release` job.
  #
  # The desktop jobs are UNCONDITIONAL: every GitHub release is the desktop's
  # electron-updater feed, so a release without the installers and the
  # latest.yml / latest-linux.yml feed files breaks update checks for every
  # user whose channel resolves to it, so there is no mode that skips them.

  build-cli:
    name: CLI / ${{ matrix.artifact }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64
            artifact: gutterpress-cli-linux-x64
          - target: bun-linux-arm64
            artifact: gutterpress-cli-linux-arm64
          - target: bun-darwin-x64
            artifact: gutterpress-cli-macos-x64
          - target: bun-darwin-arm64
            artifact: gutterpress-cli-macos-arm64
          - target: bun-windows-x64
            artifact: gutterpress-cli-windows-x64.exe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.sha }}

      - uses: ./.github/actions/bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build standalone binary
        working-directory: packages/cli
        run: bun build src/cli.ts --compile --target=${{ matrix.target }} --outfile=../../${{ matrix.artifact }}

      # Smoke test: fail fast if the compiled binary can't even run. Only
      # feasible for linux-x64 since this job runs on ubuntu-latest and can't
      # execute the other targets' binaries.
      - name: Smoke test binary
        if: ${{ matrix.target == 'bun-linux-x64' }}
        run: |
          set -euo pipefail
          chmod +x "${{ matrix.artifact }}"
          "./${{ matrix.artifact }}" --version
          # Exercise the embedded-assets extraction path — CLAUDE.md flags it
          # as the fragile part of `bun build --compile`, and --version alone
          # never touches it. `new` scaffolds from an embedded template,
          # so a broken extraction fails here instead of shipping. `--dir` is the
          # (existing) parent save location; the project lands in a slug subdir.
          mkdir -p /tmp/gutterpress-smoke
          "./${{ matrix.artifact }}" new "Smoke Test Book" --dir /tmp/gutterpress-smoke --preset book --no-git
          echo "Scaffolded files:"
          find /tmp/gutterpress-smoke -maxdepth 3 -type f | sort
          # A scaffolded project must contain at least one markdown file and a
          # manifest — proof the embedded template extracted, not just that the
          # binary ran.
          test -n "$(find /tmp/gutterpress-smoke -name '*.md' -print -quit)"
          test -n "$(find /tmp/gutterpress-smoke -name 'manifest.yaml' -print -quit)"
          # Exercise the compiled binary's registry installer and direct-entry
          # loader with a real plugin that imports a runtime dependency.
          "./${{ matrix.artifact }}" ext add markdown-it-highlightjs@4.3.0 /tmp/gutterpress-smoke/smoke-test-book
          test -f /tmp/gutterpress-smoke/smoke-test-book/plugins/npm/markdown-it-highlightjs/4.3.0/node_modules/markdown-it-highlightjs/node_modules/highlight.js/package.json
          # Cover the two npm archive/module shapes that have broken the
          # compiled installer in practice: @types' legacy tar root and a
          # package whose markdown-it plugin is a named export.
          "./${{ matrix.artifact }}" ext add markdown-it-anchor@9.2.1 /tmp/gutterpress-smoke/smoke-test-book
          "./${{ matrix.artifact }}" ext add markdown-it-emoji@3.0.0 /tmp/gutterpress-smoke/smoke-test-book --export full
          "./${{ matrix.artifact }}" build /tmp/gutterpress-smoke/smoke-test-book --format html

      - name: Upload binary
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  build-desktop-linux:
    name: Gutterpress desktop / Linux AppImage
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.sha }}

      - uses: ./.github/actions/bun

      # The composite action is the single desktop packaging path — release
      # and the download-a-build debug workflows share it, for every
      # platform, so they never diverge. It pins node 22 (all three
      # platforms package under the same Node major) and keeps
      # electron-builder on node/npm rather than bun.
      - name: Build Linux AppImage
        uses: ./.github/actions/build-gutterpress-desktop
        with:
          platform: linux

      # latest-linux.yml + .blockmap are the electron-updater feed files —
      # they must ship on the GitHub release next to the AppImage.
      - name: Upload AppImage
        uses: actions/upload-artifact@v6
        with:
          name: gutterpress-desktop-linux
          path: |
            packages/desktop/dist/*.AppImage
            packages/desktop/dist/*.blockmap
            packages/desktop/dist/latest-linux.yml
          if-no-files-found: error

  build-desktop-windows:
    name: Gutterpress desktop / Windows installer + zip
    needs: version
    # electron-builder handles Electron download, exe rename, icon embedding, zip.
    # No afterPack hook: the lib ships as a normal node_modules dependency that
    # electron-builder walks automatically (see electron-builder.yml).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.sha }}

      - uses: ./.github/actions/bun

      # See build-desktop-linux — one packaging path, every
      # platform, release and debug workflows alike.
      - name: Build Windows installer and zip
        uses: ./.github/actions/build-gutterpress-desktop
        with:
          platform: win

      # latest.yml + the installer .blockmap are the electron-updater feed —
      # they must ship on the GitHub release next to the installer.
      - name: Upload Windows installer and zip
        uses: actions/upload-artifact@v6
        with:
          name: gutterpress-desktop-windows
          path: |
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.zip
            packages/desktop/dist/*.blockmap
            packages/desktop/dist/latest.yml
          if-no-files-found: error

  build-desktop-mac:
    name: Gutterpress desktop / macOS DMG
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.sha }}

      - uses: ./.github/actions/bun

      # No version patch needed — this job checks out the bump commit the
      # `version` job pushed (ref: needs.version.outputs.sha).

      # See build-desktop-linux. The action carries
      # CSC_IDENTITY_AUTO_DISCOVERY=false, which is what keeps this unsigned
      # DMG build from searching a keychain that has no identity in it.
      - name: Build macOS Intel and Apple Silicon DMGs
        uses: ./.github/actions/build-gutterpress-desktop
        with:
          platform: mac

      - name: Upload DMGs
        uses: actions/upload-artifact@v6
        with:
          name: gutterpress-desktop-mac
          path: packages/desktop/dist/*.dmg
          if-no-files-found: error

  # ── 4. Publish to npm (skippable) ─────────────────────────────────────────
  publish-npm:
    name: Publish to npm
    # Gate npm on the FULL artifact set, not just build-cli. npm is the one
    # artifact users install unconditionally, so it must never publish a
    # version whose GitHub release could still fail to materialize. Plain
    # `needs` semantics give exactly that: every build job must succeed or
    # this job is skipped.
    needs:
      [version, build-cli, build-desktop-linux, build-desktop-windows, build-desktop-mac]
    if: ${{ !inputs.skip_npm_publish }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - uses: ./.github/actions/bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # No explicit build step — `npm publish` runs `prepublishOnly: bun run
      # build`, which produces dist/ (bun build + tsc) right before packing.

      # OIDC trusted publishing (no long-lived token) requires npm >= 11.5.1;
      # node 22 ships npm 10.x, so update it. Pinned to a known-good version
      # rather than `latest` to keep the publish step reproducible.
      - name: Update npm for OIDC trusted publishing
        run: npm install -g npm@11.5.2

      - name: Skip if already published
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if npm view "gutterpress@$VERSION" version &>/dev/null; then
            echo "Version $VERSION already published — skipping."
            echo "ALREADY_PUBLISHED=true" >> "$GITHUB_ENV"
          fi

      # Pure OIDC trusted publishing — no NODE_AUTH_TOKEN. The id-token: write
      # permission (above) lets npm mint a short-lived credential. Prerequisite:
      # gutterpress must be configured as a Trusted Publisher for this
      # repo + workflow on npmjs.com (Settings → Trusted Publishers).
      # Prereleases publish under the `next` dist-tag so `npm install
      # gutterpress (which resolves `latest`) never picks up a beta.
      - name: Publish to npm
        if: ${{ env.ALREADY_PUBLISHED != 'true' }}
        working-directory: packages/cli
        run: |
          if [ "${{ needs.version.outputs.prerelease }}" = "true" ]; then
            npm publish --provenance --access public --tag next
          else
            npm publish --provenance --access public
          fi

  # Docker publish is NOT duplicated here — docker.yml is the single Docker
  # publish path (multi-arch amd64+arm64 GHCR push). It is dispatched
  # explicitly by the github-release job below, because GitHub suppresses
  # workflow-triggering events from anything created with the workflow's own
  # GITHUB_TOKEN (workflow_dispatch is the documented exception).

  # No per-OS verify runners: all they would prove is that a cross-compiled
  # Bun binary prints --version, which cross-compilation essentially never
  # fails at, and build-cli's linux-x64 leg already runs the substantive
  # smoke (new/ext add/build). Do not add them without a recorded failure
  # class they would catch.

  # ── 6. Tag and create release with ALL artifacts ──────────────────────────
  #
  # Waits for every build job before tagging and creating the release. Users
  # see a complete release — no partial-artifact window — and a failed run
  # leaves no tag behind.

  github-release:
    name: Create GitHub Release
    needs:
      - version
      - build-cli
      - build-desktop-linux
      - build-desktop-windows
      - build-desktop-mac
      - publish-npm
    # `always()` exists ONLY so an intentionally-skipped publish-npm
    # (skip_npm_publish) doesn't skip the release; every build job must have
    # actually succeeded.
    if: |
      always() &&
      needs.version.result == 'success' &&
      needs.build-cli.result == 'success' &&
       needs.build-desktop-linux.result == 'success' &&
       needs.build-desktop-windows.result == 'success' &&
       needs.build-desktop-mac.result == 'success' &&
      (needs.publish-npm.result == 'success' || needs.publish-npm.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Needed to dispatch Docker and package-manager follow-up workflows.
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.sha }}

      - name: Download CLI artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifact-downloads/
          pattern: "gutterpress-cli-*"

      - name: Download desktop artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifact-downloads/
          pattern: "gutterpress-desktop-*"

      # download-artifact creates one directory per workflow artifact. Flatten
      # the actual files into the release upload directory, reject duplicate
      # basenames, and hash every file with Node so this works independently of
      # platform-specific sha256sum/shasum commands.
      - name: Stage release files and generate SHA-256 checksums
        run: node tools/prepare-release-assets.mjs artifact-downloads release-assets

      # Update-feed integrity gate: every release doubles as the desktop's
      # electron-updater feed, so a missing feed file or installer must fail
      # HERE, loudly — not ship as a release that 404s every update check
      # (the 0.8.2-rc.1 incident). Checks: all named assets exist, the feed
      # files advertise exactly this release's version, and every artifact a
      # feed file references is among the assets being uploaded.
      - name: Verify release assets (update-feed integrity)
        run: |
          set -euo pipefail
          TAG="${{ needs.version.outputs.tag }}"
          VERSION="${TAG#v}"
          ls -l release-assets/

          missing=0
          for f in \
            gutterpress-cli-linux-x64 gutterpress-cli-linux-arm64 \
            gutterpress-cli-macos-x64 gutterpress-cli-macos-arm64 \
            gutterpress-cli-windows-x64.exe \
            "Gutterpress-$VERSION.AppImage" \
            Gutterpress-setup-win-x64.exe \
            "Gutterpress-$VERSION-win-x64.zip" \
            "Gutterpress-$VERSION-arm64.dmg" \
            "Gutterpress-$VERSION-x64.dmg" \
            latest.yml latest-linux.yml SHA256SUMS.txt; do
            if [ ! -f "release-assets/$f" ]; then
              echo "::error::Missing release asset: $f"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

           if [ -f "release-assets/Gutterpress-$VERSION-win-x64.exe" ]; then
            echo "::error::Windows installer basename regressed to a versioned name"
            exit 1
          fi
           if ! grep -Fq 'Gutterpress-setup-win-x64.exe' release-assets/latest.yml; then
            echo "::error::latest.yml does not reference the stable Windows installer basename"
            exit 1
          fi

          for f in latest.yml latest-linux.yml; do
            feed_version="$(sed -n 's/^version: *//p' "release-assets/$f" | head -1)"
            if [ "$feed_version" != "$VERSION" ]; then
              echo "::error::release-assets/$f advertises version '$feed_version' but this release is $VERSION"
              exit 1
            fi
            grep -E '^\s*(- )?(url|path): ' "release-assets/$f" | sed -E 's/^\s*(- )?(url|path): *//' | sort -u |
              while read -r ref; do
                if [ ! -f "release-assets/$ref" ]; then
                  echo "::error::release-assets/$f references '$ref', which is not among the release assets"
                  exit 1
                fi
              done
          done

      - name: Prepare supported-platform and unsigned-install guidance
        run: |
          cat > release-notes.md <<'EOF'
          ## Supported downloads

          | Product | Native builds | Known compatibility gaps |
          | --- | --- | --- |
           | Gutterpress desktop | macOS Apple Silicon (ARM64), macOS Intel (x64), Windows x64, Linux x64 AppImage | Accepted until demand justifies new targets: Windows ARM64 uses x64 emulation; there is no Linux ARM64 desktop build. |
          | Standalone CLI | macOS ARM64/x64, Windows x64, Linux ARM64/x64 (glibc) | Accepted until demand justifies new targets: Windows ARM64 uses x64 emulation; Alpine/musl uses the Docker image instead. |

           On Windows, `Gutterpress-setup-win-x64.exe` is the normal installer and keeps the same basename across releases. `Gutterpress-<version>-win-x64.zip` is the separate portable extract-and-run build; it is not the installed app's auto-update channel.

          ## Unsigned download notice

           The desktop installers and standalone CLI binaries are intentionally unsigned while code-signing certificates are not affordable. Verify the SHA-256 value below before bypassing an operating-system warning.

          ### macOS Gatekeeper

          Try opening the app once, then open **System Settings > Privacy & Security** and choose **Open Anyway**. For a verified download, the command-line alternative is:

          ```sh
           xattr -dr com.apple.quarantine "/Applications/Gutterpress.app"
          # CLI example:
          xattr -d com.apple.quarantine /path/to/gutterpress-cli-macos-arm64
          ```

          ### Windows SmartScreen

           If Windows shows "Windows protected your PC", choose **More info > Run anyway** after verifying the checksum. This applies to both the desktop installer and standalone CLI executable.

          ## SHA-256 checksums

          The same values are attached as `SHA256SUMS.txt`.

          ```text
          EOF
          cat release-assets/SHA256SUMS.txt >> release-notes.md
          cat >> release-notes.md <<'EOF'
          ```
          EOF

      # The tag is created HERE, at the bump commit every artifact above was
      # built from, and only once they all exist (see the `version` job's
      # header). A prerelease tag left by an earlier dispatch of the SAME
      # version is re-pointed; a stable one was already refused by `version`.
      - name: Tag the release commit
        env:
          TAG: ${{ needs.version.outputs.tag }}
          SHA: ${{ needs.version.outputs.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            if [ "${{ needs.version.outputs.prerelease }}" = "true" ]; then
              echo "Prerelease $TAG already exists on origin — re-pointing it at $SHA."
              git push origin ":refs/tags/$TAG"
            else
              echo "::error::Tag $TAG already exists on origin. Stable release tags are immutable."
              exit 1
            fi
          fi
          git tag "$TAG" "$SHA"
          git push origin "$TAG"

      - name: Create GitHub release
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          REPO="${{ github.repository }}"

          PRERELEASE_FLAG=""
          if [ "${{ needs.version.outputs.prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          # Mirror the tag-immutability check from the `version`
          # job here too. A stable release, once published, must not be
          # silently deleted and recreated. Prereleases may still be
          # re-dispatched (the version job already allowed re-pointing the
          # tag in that case), so a stub release left over from an earlier
          # failed run of the SAME prerelease is replaced deliberately.
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            if [ "${{ needs.version.outputs.prerelease }}" = "true" ]; then
              echo "Prerelease $TAG already has a release — deleting to recreate with current artifacts..."
              gh release delete "$TAG" --yes --repo "$REPO"
            else
              echo "::error::Release $TAG already exists. Stable releases are immutable — refusing to delete and recreate it. Dispatch a new version instead."
              exit 1
            fi
          fi

          gh release create "$TAG" \
            --repo "$REPO" \
             --title "Gutterpress $TAG" \
            --generate-notes \
            --notes-file release-notes.md \
            --verify-tag \
            $PRERELEASE_FLAG \
            release-assets/*
        env:
          GH_TOKEN: ${{ github.token }}

      # This repository is itself a usable Homebrew tap and Scoop bucket. A
      # separate rerunnable workflow updates their hashes from the checksum
      # attached above. Prereleases never replace stable package-manager data.
      - name: Update stable package-manager metadata
        if: ${{ needs.version.outputs.prerelease != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          gh workflow run package-managers.yml \
            --repo "${{ github.repository }}" \
            --ref "$DEFAULT_BRANCH" \
            -f version="$VERSION"

      # GitHub suppresses events from releases created with GITHUB_TOKEN (to
      # prevent workflow recursion; workflow_dispatch is exempt), so dispatch
      # docker.yml explicitly at the release tag. metadata-action derives the semver
      # image tags from the tag ref; docker.yml applies `latest` only to
      # stable versions dispatched at their matching v<version> tag ref.
      - name: Publish Docker image (dispatch docker.yml at the tag)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh workflow run docker.yml \
            --repo "${{ github.repository }}" \
            --ref "$TAG" \
            -f tag="$VERSION"
