name: Windows lib integration tests

# Exercises packages/lib's startPreviewServer with native windows
# backslash paths. This is the lower-level test — the viewer's IPC-driven
# flow is covered separately by .github/workflows/windows-electron-test.yml.

on:
  push:
    branches: [main]
    paths:
      - 'packages/lib/**'
      - '.github/workflows/windows-lib-test.yml'
  pull_request:
    paths:
      - 'packages/lib/**'
      - '.github/workflows/windows-lib-test.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Lib integration tests on Windows
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build lib dist
        working-directory: packages/lib
        run: bun run build

      - name: Run lib integration tests (windows paths)
        working-directory: packages/lib
        run: bun test tests/integration/preview-server-windows.test.ts
