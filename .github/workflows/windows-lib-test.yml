name: Windows lib + viewer integration tests

# Two layers of windows verification, both run on windows-latest:
#
#  1. Lib unit-level integration: exercises startPreviewServer directly
#     with native windows backslash paths.
#  2. Viewer API integration: builds the viewer's adapter-node server and
#     drives /api/preview over real HTTP — the exact code path the
#     Electron viewer hits when a user picks a folder.
#
# If both pass, the directory-load failure is NOT in the lib or in the
# viewer's HTTP layer — it can only be in the Electron UI shell or
# preload bridge, which we'd then exercise with a headless Electron test.

on:
  push:
    branches: [main]
    paths:
      - 'packages/lib/**'
      - 'packages/viewer/**'
      - '.github/workflows/windows-lib-test.yml'
  pull_request:
    paths:
      - 'packages/lib/**'
      - 'packages/viewer/**'
      - '.github/workflows/windows-lib-test.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Lib + viewer integration tests on Windows
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build lib dist
        working-directory: packages/lib
        run: bun run build

      - name: Run lib integration tests (windows paths)
        working-directory: packages/lib
        run: bun test tests/integration/preview-server-windows.test.ts

      - name: Build viewer
        working-directory: packages/viewer
        run: |
          npx vite build
          npm run electron:build

      - name: Run viewer /api/preview integration test (windows paths)
        run: node packages/viewer/tests/integration/api-preview-windows.test.mjs
