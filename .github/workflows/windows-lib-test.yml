name: Windows lib integration tests

# Exercises packages/lib's startPreviewServer with native windows
# backslash paths. This is the lower-level test — the viewer's IPC-driven
# flow is covered separately by .github/workflows/windows-electron-test.yml.
#
# Also runs the full remote-auth (clone/sync/pull/push) + source-provider +
# project-source suites AND the sync end-to-end scenario
# (src/lib/remote-auth/sync-e2e.test.ts) on windows-latest — the git/sync
# surface is pure isomorphic-git (CLAUDE.md §7) and the field topology
# (app-cloned repo, project as a subfolder, no system git) must be executed
# on real Windows paths, not only Linux. A Linux job runs the same suites so
# both platforms stay covered by one workflow.

on:
  # Manual + release-time only: Windows runners bill 2x minutes, and the
  # per-push signal belongs to the Linux suites. Run before releases or when
  # touching git/sync/electron platform code (user cost mandate 2026-06-11).
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Lib integration tests on Windows
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build lib dist
        working-directory: packages/lib
        run: bun run build

      - name: Run lib integration tests (windows paths)
        working-directory: packages/lib
        run: bun test tests/integration/preview-server-windows.test.ts

      # Filters are name fragments (substring match on the test file path)
      # so they work identically with Windows backslash paths.
      - name: Run git/sync suites + sync e2e (windows paths)
        working-directory: packages/lib
        run: bun test remote-auth source-provider project-source

  test-linux:
    name: Lib git/sync suites on Linux
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run git/sync suites + sync e2e
        working-directory: packages/lib
        run: bun test remote-auth source-provider project-source
