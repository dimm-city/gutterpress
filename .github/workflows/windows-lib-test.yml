name: Windows lib integration test

# Exercises the lib's preview server on Windows with native (backslash) paths.
# The viewer's /api/preview route is a thin wrapper over startPreviewServer,
# so a passing run here proves the viewer's directory-load path works on
# Windows without needing to drive Electron in CI.

on:
  push:
    branches: [main]
    paths:
      - 'packages/lib/**'
      - 'packages/viewer/src/routes/api/**'
      - '.github/workflows/windows-lib-test.yml'
  pull_request:
    paths:
      - 'packages/lib/**'
      - 'packages/viewer/src/routes/api/**'
      - '.github/workflows/windows-lib-test.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Lib integration tests on Windows
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run lib integration tests
        working-directory: packages/lib
        run: bun test tests/integration/preview-server-windows.test.ts
