name: CI

on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:
    branches: [main, develop, "release/**"]

env:
  # Skip Puppeteer download during dependency installation
  # We'll use system Chrome instead to avoid 403 errors
  PUPPETEER_SKIP_DOWNLOAD: 'true'
  PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The PDF/X tests self-skip when their external tool is absent
      # (ghostscript.integration.test.ts uses `ghostscript ? test : test.skip`),
      # so without these the suite reports green while never exercising real
      # PDF/X color conversion at all.
      #
      # Ghostscript has a SECOND dependent, and it is the one with no second
      # chance: page-background-chromium-bug.canary.test.ts, the expiry trigger
      # for the `@page { background: url() }` preload shim (RECOMMENDATION.md
      # §6). It needs Chromium AND Ghostscript, and self-skips on either. A
      # skipped canary is a green CI that has stopped watching for the day
      # Chromium fixes #152 — the shim then entrenches silently, which is the
      # exact failure §7 risk 10 names. So this job must always leave SOME
      # Chromium and SOME Ghostscript resolvable. Removing either tool entirely
      # means deleting that test and its shim in the same change.
      #
      # That sentence used to end "(which of the two Chromes it resolves does
      # not matter — both track stable)". There is now exactly one: the runner
      # image's, at /usr/bin/google-chrome-stable. See the note above the
      # Puppeteer step below for why the second one went away.
      - name: Install PDF tooling (Ghostscript, qpdf)
        run: |
          sudo apt-get update
          sudo apt-get install -y ghostscript qpdf

      - name: Setup Bun (cached)
        uses: ./.github/actions/bun

      - name: Install dependencies
        run: bun install

      # NO `browser-actions/setup-chrome` step, on purpose — do not re-add one.
      # It used to sit directly after `checkout`, downloading ~150MB of Chrome
      # for Testing to /opt/hostedtoolcache/setup-chrome/..., which nothing then
      # used: this step pins PUPPETEER_EXECUTABLE_PATH to the runner IMAGE's
      # Chrome (/usr/bin/google-chrome-stable), and BOTH resolvers check that
      # env var before any other candidate (lib/chromium.ts's SYSTEM_PATHS and
      # engine/shared/cdp.ts's CANDIDATES). setup-chrome's binary is named
      # `chrome`, so it was not reachable via the PATH probe either — that runs
      # only once every fixed path misses. Run 32812569951 shows both halves:
      # "Google Chrome for Testing 152.0.7977.54" installed, then
      # `PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome-stable` on every
      # step after it, the parity gate and the canary included.
      #
      # Deleted rather than adopted: `chrome-version: stable` pins nothing, so
      # the action bought no reproducibility the runner image doesn't already
      # give — it only made the version LOOK controlled. If a SPECIFIC Chromium
      # is ever needed (e.g. to hold the engine's REQUIRED_MILESTONE floor,
      # cdp.ts:67), add it back with an EXACT version and delete this override —
      # one or the other, never both, or the pin is a no-op again.
      - name: Configure Puppeteer to use system Chrome
        run: |
          echo "PUPPETEER_EXECUTABLE_PATH=$(which google-chrome-stable)" >> $GITHUB_ENV

      # The desktop suite imports gutterpress by name (resolves to its built
      # dist/), so build the package first — same prerequisite as release.yml.
      # The cli suite's own tests/integration/package-exports.test.ts needs the
      # same build: it resolves gutterpress/* subpaths against a real dist/
      # and hard-fails (not skips, per AP-21) when dist/ is missing.
      - name: Build package dist
        run: bun run build
        working-directory: packages/cli

      # THE SAME COMMAND release.yml's Test job runs, on purpose. These two
      # gates drifted three times in one release cycle and every drift shipped
      # a failure to the later, slower gate: the Ghostscript gap and the cdp
      # launch timeout both failed RELEASE dispatches after ci was green,
      # because ci ran `--filter gutterpress` while release ran `--filter '*'`.
      # One command, run at PR time, means anything that would fail the
      # release gate fails here first. This also replaced the separate
      # "Desktop Test" job (2026-08-30): same coverage, one fewer runner, one
      # fewer duplicated install/build, and no second surface to drift.
      - name: Run tests
        run: bun --filter '*' test

      - name: Test Open Design plugin contract
        working-directory: packages/open-design-plugin
        run: bun test

      # Preview<->print parity is the invariant this project treats as most
      # important, and until now the gate ran only when a human remembered.
      - name: Preview/print parity gate
        working-directory: packages/cli
        run: bun scripts/native-parity-gate.ts

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check release distribution tooling and metadata
        run: |
          node tools/prepare-release-assets.test.mjs
          node tools/update-package-managers.test.mjs
          node tools/update-package-managers.mjs --check

      - name: Setup Bun (cached)
        uses: ./.github/actions/bun

      - name: Install dependencies
        run: bun install

      # Self-tests first (a gate must prove it can fail — see
      # docs/plans/source-first-editor/guardrails.md), then the live checks:
      # same self-test-then-gate pattern as the renderer-purity pair below.
      - name: Check generated-file hygiene self-test
        run: node tools/check-generated-files.test.mjs

      - name: Check generated-file hygiene (no tracked build output)
        run: bun run check:generated-files

      - name: Check architecture boundaries self-test
        run: node tools/check-architecture.test.mjs

      - name: Check architecture boundaries (plan D4/D10 + ProseMirror ban)
        run: bun run check:architecture

      # SFE-P1b2 repair (G-12/AP-20): verify-vendored.mjs (the checksum +
      # completeness gate proving packages/vscode-markdown-editor/dist/ is
      # either byte-identical to the published tarball or exactly the
      # reviewed gp-fork patch state — see that package's PATCHES.md) had no
      # CI invocation path and no committed self-test, despite PATCHES.md
      # and SFE-P1b2.md's "Security and trust" section both claiming it ran.
      # Same self-test-then-gate order as the generated-files pair above.
      - name: Check vendored fork integrity self-test
        run: node packages/vscode-markdown-editor/scripts/verify-vendored.test.mjs

      - name: Check vendored fork integrity (renderCustomBlock patch)
        run: bun run check:vendored

      # packages/editor (@dimm-city/gutterpress-editor, SFE-P1a): self-test
      # first (a gate must prove it can fail), then the live D4 browser-purity
      # gate, then the package's own typecheck/test — none of these ran in CI
      # before this step existed (AP-20: a gate that exists but is never
      # invoked is the same as no gate at all). NOTE: never `bun --cwd
      # <pkg> run <script>` — see the NOTE at the type-check job below;
      # `working-directory` + `bun run <script>` is the only form Bun 1.3.x
      # actually executes.
      - name: Check editor browser-purity self-test
        run: node packages/editor/scripts/check-browser-purity.test.mjs

      - name: Check editor browser-purity (D4)
        working-directory: packages/editor
        run: bun run check:browser-purity

      # SFE-P2b repair (G-12/AP-20 shape): packages/editor now depends on
      # "gutterpress": "workspace:*" and four files resolve `gutterpress/render`
      # (src/gutterpress/{match,mount,plan,provider}.ts type-only;
      # tests/gutterpress/provider.test.ts, tests/gutterpress/limits.btest.ts,
      # and tests/gutterpress/support/entry.ts as value imports). That subpath
      # maps only to packages/cli's gitignored dist/render.{js,d.ts} — build it
      # here, same prerequisite and command the desktop-test/type-check jobs
      # already document for their own gutterpress-by-name consumers, so every
      # job that resolves gutterpress/render builds it first instead of
      # depending on a stale dist/ left over from a previous step.
      - name: Build package dist (packages/editor resolves gutterpress/render)
        working-directory: packages/cli
        run: bun run build:library

      - name: Run TypeScript compiler (packages/editor)
        working-directory: packages/editor
        run: bun run typecheck

      - name: Run tests (packages/editor)
        working-directory: packages/editor
        run: bun run test

      # SFE-P1b repair (G-12/AP-20): test:browser was a required run gate
      # with no CI invocation path, so the 37 real-Chromium assertions
      # backing every D5 case's PASS row in SFE-P1b-decision.md ran zero
      # times in CI. `packages/editor/tests/browser-harness/browser.ts`'s
      # launch fallback tries PLAYWRIGHT_BROWSERS_PATH, then this env var,
      # then a fixed system-Chrome path list — never `playwright install` —
      # so pointing it at the runner image's preinstalled Chrome (the same
      # binary the `test`/`desktop-test` jobs already use for Puppeteer) is
      # enough; no browser download step is added.
      - name: Configure browser harness to use system Chrome
        run: echo "PUPPETEER_EXECUTABLE_PATH=$(which google-chrome-stable)" >> $GITHUB_ENV

      - name: Run browser tests (packages/editor)
        working-directory: packages/editor
        run: bun run test:browser

      # packages/vscode-extension (@dimm-city/gutterpress-vscode, SFE-P1a):
      # same AP-20 rationale as packages/editor above — a package having
      # `typecheck`/`test` scripts proves nothing if CI never runs them.
      - name: Run TypeScript compiler (packages/vscode-extension)
        working-directory: packages/vscode-extension
        run: bun run typecheck

      - name: Run tests (packages/vscode-extension)
        working-directory: packages/vscode-extension
        run: bun run test

      # knip was dropped 2026-08-30 (owner's call). Its lifetime as a gate: 4
      # days; 3 failures, all its own wiring bug (missing svelte-kit sync),
      # which blocked the 0.10.2 release PR; 0 real catches while gating. Its
      # 3 real findings all came at setup time (91af058) — one-time value,
      # already banked.

      - name: Build CLI npm bundle
        working-directory: packages/cli
        run: bun run build

      # NOTE: never use `bun --cwd <pkg> run <script>` in workflows — on Bun
      # 1.3.x that form prints `bun run` usage and EXITS 0 without running the
      # script, so the step passes while doing nothing (review finding: this
      # made the desktop-build and type-check steps silent no-ops).
      # `working-directory` + `bun run <script>` is the robust form.
      - name: Build desktop (static SPA + Electron main)
        working-directory: packages/desktop
        run: |
          bun run build
          bun run electron:build

      # Self-test for the guardrail script itself (dependency-free by design):
      # if a refactor breaks its detection regexes, this must fail loudly
      # rather than letting the real gate below pass vacuously.
      - name: Check renderer purity self-test
        run: node tools/check-render-purity.test.mjs

      # §8 renderer-purity guardrail: fail if host/node code leaked into the
      # built desktop CLIENT SPA bundle. Since SFE-P5d switched the desktop
      # to @sveltejs/adapter-static, the entire build/ directory IS the
      # client bundle (no build/server or build/handler.js exists anymore),
      # so the scan covers build/ — matching the package's own build script.
      # --strict: the build step above just ran, so an absent build/ means
      # the build silently did nothing — that must FAIL, not skip (review
      # finding: the non-strict form passed vacuously while the broken
      # `bun --cwd` build step produced no output at all).
      - name: Check renderer purity (CLAUDE.md §8)
        run: node tools/check-render-purity.mjs packages/desktop/build --strict


  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun (cached)
        uses: ./.github/actions/bun

      - name: Install dependencies
        run: bun install

      # NOTE: `working-directory` + `bun run <script>`, never
      # `bun --cwd <pkg> run <script>` — on Bun 1.3.x the latter prints usage
      # and exits 0 WITHOUT running the script. Review finding: every step in
      # this job used that broken form, so the whole Type Check job was a
      # silent no-op that always passed.
      #
      # svelte-check and the electron tsc resolve gutterpress's types
      # to packages/cli/dist/*.d.ts (gitignored), so build the CLI dist first —
      # same prerequisite the desktop-test job already documents.
      - name: Build package dist (types for the desktop checks)
        working-directory: packages/cli
        run: bun run build:library

      - name: Run TypeScript compiler (CLI)
        working-directory: packages/cli
        run: bun run typecheck

      - name: Run TypeScript compiler (desktop SPA)
        working-directory: packages/desktop
        run: bun run check

      # audit F1: `check` above is svelte-check (SPA only). The Electron
      # main/preload TS was never type-checked in CI — its `typecheck` script
      # existed but nothing ran it, so a type error in electron/main.ts merged
      # green. Run it too.
      - name: Run TypeScript compiler (desktop Electron main/preload)
        working-directory: packages/desktop
        run: bun run typecheck
