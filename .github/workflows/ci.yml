name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  # Skip Puppeteer download during dependency installation
  # We'll use system Chrome instead to avoid 403 errors
  PUPPETEER_SKIP_DOWNLOAD: 'true'
  PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run ESLint
        run: bun run lint
        continue-on-error: true

      - name: Check Prettier formatting
        run: bun run format:check
        continue-on-error: true

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Configure Puppeteer to use system Chrome
        run: |
          echo "PUPPETEER_EXECUTABLE_PATH=$(which google-chrome-stable)" >> $GITHUB_ENV

      - name: Run tests
        run: bun test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Check build artifacts
        run: |
          test -f dist/cli.js || (echo "Build failed: dist/cli.js not found" && exit 1)
          test -d dist/assets || (echo "Build failed: dist/assets not found" && exit 1)

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run TypeScript compiler
        run: bunx tsc --noEmit

  pdfx-smoke:
    name: PDF/X Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install OS tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ghostscript qpdf

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure Chromium path
        # setup-chrome installs `google-chrome` (a wrapper); fall back to
        # `google-chrome-stable` and the bundled chromium-browser if the
        # canonical path isn't present.
        run: |
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            path="$(command -v "$candidate" || true)"
            if [ -n "$path" ]; then
              echo "CHROMIUM_PATH=$path" >> "$GITHUB_ENV"
              echo "Resolved CHROMIUM_PATH=$path"
              exit 0
            fi
          done
          echo "No Chromium binary found on PATH" >&2
          exit 1

      - name: Build sample PDF/X artifact
        # `build` now operates on a markdown directory and produces book.pdf
        # in --out (the static viewer chrome is also emitted alongside). The
        # previous `--input <htmlFile> --out <pdfFile>` form was removed when
        # build absorbed convert+assets. Use the minimal `template` example
        # for the smoke test — simple letter-size pages, no plugins.
        run: |
          set -x
          bun src/cli.ts build examples/template \
            --out .ci-smoke \
            --pdfx x1a \
            --icc profiles/CGATS21_CRPC1.icc
          ls -la .ci-smoke/

      - name: Strict PDF/X structural validation
        run: |
          set -x
          qpdf --check .ci-smoke/book.pdf
          bun src/cli.ts validate \
            --pdf .ci-smoke/book.pdf \
            --phase post-build \
            --only pdf.print.pdfx-markers,pdf.print.pdfx-metadata

      - name: Verify fingerprint artifact emitted
        run: test -f .ci-smoke/build-fingerprint.json

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies with frozen lockfile
        run: bun install --frozen-lockfile

      - name: Run security audit
        run: bun audit || true
        continue-on-error: true

      - name: Check for vulnerabilities
        run: |
          echo "Running dependency security audit..."
          bun audit --json > audit-results.json || true
          if [ -f audit-results.json ]; then
            echo "Audit completed. Review audit-results.json for details."
          fi
