name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  # Skip Puppeteer download during dependency installation
  # We'll use system Chrome instead to avoid 403 errors
  PUPPETEER_SKIP_DOWNLOAD: 'true'
  PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Setup Bun (cached)
        uses: ./.github/actions/bun

      - name: Install dependencies
        run: bun install

      - name: Configure Puppeteer to use system Chrome
        run: |
          echo "PUPPETEER_EXECUTABLE_PATH=$(which google-chrome-stable)" >> $GITHUB_ENV

      - name: Run tests
        run: bun --filter @dimm-city/print-md test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun (cached)
        uses: ./.github/actions/bun

      - name: Install dependencies
        run: bun install

      - name: Build CLI npm bundle
        working-directory: packages/cli
        run: bun run build

      # NOTE: never use `bun --cwd <pkg> run <script>` in workflows — on Bun
      # 1.3.x that form prints `bun run` usage and EXITS 0 without running the
      # script, so the step passes while doing nothing (review finding: this
      # made the viewer-build and type-check steps silent no-ops).
      # `working-directory` + `bun run <script>` is the robust form.
      - name: Build viewer (static SPA + Electron main)
        working-directory: packages/viewer
        run: |
          bun run build
          bun run electron:build

      # Self-test for the guardrail script itself (dependency-free by design):
      # if a refactor breaks its detection regexes, this must fail loudly
      # rather than letting the real gate below pass vacuously.
      - name: Check renderer purity self-test
        run: node tools/check-render-purity.test.mjs

      # §8 renderer-purity guardrail: fail if host/node code leaked into the
      # built viewer CLIENT SPA bundle. Scope is build/client/ ONLY —
      # adapter-node's build/server/ + build/handler.js are host Node code by
      # design (§8). --strict: the build step above just ran, so an absent
      # build/client means the build silently did nothing — that must FAIL,
      # not skip (review finding: the non-strict form passed vacuously while
      # the broken `bun --cwd` build step produced no output at all).
      - name: Check renderer purity (CLAUDE.md §8)
        run: node tools/check-render-purity.mjs packages/viewer/build/client --strict

  viewer-test:
    name: Viewer Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun (cached)
        uses: ./.github/actions/bun

      - name: Install dependencies
        run: bun install

      # The viewer suite imports @dimm-city/print-md by name (resolves to its
      # built dist/), so build the package before running viewer tests — same
      # prerequisite and command as release.yml's `test` job, kept identical
      # so the two gates cannot drift apart.
      - name: Build package dist
        run: bun run build
        working-directory: packages/cli

      - name: Run viewer tests
        run: bun run test
        working-directory: packages/viewer

      - name: Run viewer lint
        run: bun run lint
        working-directory: packages/viewer

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun (cached)
        uses: ./.github/actions/bun

      - name: Install dependencies
        run: bun install

      # NOTE: `working-directory` + `bun run <script>`, never
      # `bun --cwd <pkg> run <script>` — on Bun 1.3.x the latter prints usage
      # and exits 0 WITHOUT running the script. Review finding: every step in
      # this job used that broken form, so the whole Type Check job was a
      # silent no-op that always passed.
      #
      # svelte-check and the electron tsc resolve @dimm-city/print-md's types
      # to packages/cli/dist/*.d.ts (gitignored), so build the CLI dist first —
      # same prerequisite the viewer-test job already documents.
      - name: Build package dist (types for the viewer checks)
        working-directory: packages/cli
        run: bun run build:library

      - name: Run TypeScript compiler (CLI)
        working-directory: packages/cli
        run: bun run typecheck

      - name: Run TypeScript compiler (viewer SPA)
        working-directory: packages/viewer
        run: bun run check

      # audit F1: `check` above is svelte-check (SPA only). The Electron
      # main/preload TS was never type-checked in CI — its `typecheck` script
      # existed but nothing ran it, so a type error in electron/main.ts merged
      # green. Run it too.
      - name: Run TypeScript compiler (viewer Electron main/preload)
        working-directory: packages/viewer
        run: bun run typecheck

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun (cached)
        uses: ./.github/actions/bun

      - name: Install dependencies with frozen lockfile
        run: bun install --frozen-lockfile

      # `bun audit --json` exits non-zero for ANY advisory (including low/
      # moderate), so this step's only job is to produce the full report for
      # the artifact upload below — severity gating happens in the dedicated
      # step after it. This is not a "|| true" neutering the real check: the
      # real check is the ungated step at the end of this job.
      - name: Generate audit report (JSON)
        run: bun audit --json > audit-results.json || true

      - name: Upload audit results
        uses: actions/upload-artifact@v6
        with:
          name: audit-results
          path: audit-results.json
          if-no-files-found: error

      # Real gate: bun's own --audit-level flag filters by severity and sets
      # the process exit code accordingly, so no custom JSON-parsing script
      # is needed to gate cleanly. Fails the job on any high or critical
      # advisory; low/moderate advisories do not block CI.
      - name: Fail on high/critical advisories
        run: bun audit --audit-level=high
