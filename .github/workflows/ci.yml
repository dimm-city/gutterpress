name: CI

on:
  push:
    branches: [main, develop, "release/**"]
    paths: &ci-paths
      - "**"
      - "!*.md"
      - "!docs/**"
      - "!packages/*/*.md"
      - "!packages/*/docs/**"
      - "!packaging/*.md"
      - "!website/**"
      - "docs/fixtures/**"
  pull_request:
    branches: [main, develop, "release/**"]
    paths: *ci-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Select gates
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      cli: ${{ steps.scope.outputs.cli }}
      desktop: ${{ steps.scope.outputs.desktop }}
      plugin: ${{ steps.scope.outputs.plugin }}
      tooling: ${{ steps.scope.outputs.tooling }}
      render: ${{ steps.scope.outputs.render }}
      preview: ${{ steps.scope.outputs.preview }}
      behaviour: ${{ steps.scope.outputs.behaviour }}
      audit: ${{ steps.scope.outputs.audit }}
    steps:
      - uses: actions/checkout@v5
      - run: node --test tools/ci-scope.test.mjs
      - id: scope
        run: node tools/ci-scope.mjs

  checks:
    name: Checks
    needs: scope
    if: >-
      needs.scope.outputs.cli == 'true' || needs.scope.outputs.desktop == 'true' ||
      needs.scope.outputs.plugin == 'true' || needs.scope.outputs.tooling == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Check release tooling
        if: needs.scope.outputs.tooling == 'true'
        run: |
          node tools/prepare-release-assets.test.mjs
          node tools/update-package-managers.test.mjs
          node tools/update-package-managers.mjs --check

      - uses: ./.github/actions/bun
        if: needs.scope.outputs.cli == 'true' || needs.scope.outputs.desktop == 'true' || needs.scope.outputs.plugin == 'true'
      - name: Install dependencies once
        if: needs.scope.outputs.cli == 'true' || needs.scope.outputs.desktop == 'true' || needs.scope.outputs.plugin == 'true'
        run: bun install --frozen-lockfile
      - name: Build CLI and library once
        if: needs.scope.outputs.cli == 'true' || needs.scope.outputs.desktop == 'true'
        working-directory: packages/cli
        run: bun run build
      - name: Type check CLI
        if: needs.scope.outputs.cli == 'true'
        working-directory: packages/cli
        run: bun run typecheck
      - name: Build and check desktop
        if: needs.scope.outputs.desktop == 'true'
        working-directory: packages/desktop
        run: |
          node_modules/.bin/vite build
          bun run electron:build
          node ../../tools/check-render-purity.test.mjs
          node ../../tools/check-render-purity.mjs build/client --strict
          bun run check
          bun run typecheck

      - name: Install PDF tools from cache
        if: needs.scope.outputs.cli == 'true'
        uses: ./.github/actions/pdf-tools
      - name: Use the runner's Chrome
        if: needs.scope.outputs.cli == 'true' || needs.scope.outputs.preview == 'true'
        run: echo "CHROMIUM_PATH=$(command -v google-chrome-stable)" >> "$GITHUB_ENV"
      # Release reuse requires this exact step to succeed, not just a green
      # workflow in which an unrelated package or a docs change was checked.
      - name: Run all workspace tests
        if: needs.scope.outputs.cli == 'true' && needs.scope.outputs.desktop == 'true' && needs.scope.outputs.plugin == 'true'
        run: bun --filter '*' test
      - name: Run CLI tests
        if: needs.scope.outputs.cli == 'true' && !(needs.scope.outputs.desktop == 'true' && needs.scope.outputs.plugin == 'true')
        working-directory: packages/cli
        run: bun test
      - name: Run desktop tests
        if: needs.scope.outputs.desktop == 'true' && !(needs.scope.outputs.cli == 'true' && needs.scope.outputs.plugin == 'true')
        working-directory: packages/desktop
        run: bun run test
      - name: Run plugin tests
        if: needs.scope.outputs.plugin == 'true' && !(needs.scope.outputs.cli == 'true' && needs.scope.outputs.desktop == 'true')
        working-directory: packages/open-design-plugin
        run: bun test
      - name: Preview/print parity gate
        if: needs.scope.outputs.render == 'true'
        working-directory: packages/cli
        run: bun scripts/native-parity-gate.ts
      - name: Preview smoke with the runner's Chrome
        if: needs.scope.outputs.preview == 'true'
        timeout-minutes: 5
        working-directory: packages/cli
        run: node_modules/.bin/playwright test -c tests/compat/playwright.config.ts
        env:
          DEBUG: pw:webserver
      - name: Drive the desktop app
        if: needs.scope.outputs.behaviour == 'true'
        timeout-minutes: 5
        working-directory: packages/desktop
        run: |
          command -v xvfb-run
          xvfb-run -a node tests/integration/problems-last-hop.pw.mjs out/main/main.js
          xvfb-run -a node tests/integration/app-lifecycle-log.pw.mjs out/main/main.js
          xvfb-run -a node tests/integration/editor-opens-with-content.pw.mjs
          xvfb-run -a node tests/integration/editor-toggle-loads-module.pw.mjs
          xvfb-run -a node tests/integration/panel-reopen-on-failed-open.pw.mjs
          xvfb-run -a node tests/integration/problems-panel.pw.mjs
          xvfb-run -a node tests/integration/online-copy.pw.mjs
          xvfb-run -a node tests/integration/extension-updates.pw.mjs out/main/main.js
          xvfb-run -a node tests/integration/block-properties.pw.mjs
          xvfb-run -a node tests/integration/editor-dropdown-sync.pw.mjs out/main/main.js
          xvfb-run -a node tests/integration/preview-zoom-wheel.pw.mjs out/main/main.js

  security-audit:
    needs: scope
    if: needs.scope.outputs.audit == 'true'
    uses: ./.github/workflows/security-audit.yml

  render-parity:
    name: Render parity (public fixtures)
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event_name == 'pull_request' && needs.scope.outputs.render == 'true'
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v5

      - name: Checkout PR base
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Setup Bun (cached)
        uses: ./.github/actions/bun

      - name: Install dependencies (head)
        run: bun install --frozen-lockfile

      - name: Install dependencies (base)
        run: bun install --frozen-lockfile
        working-directory: base

      - name: Build head CLI
        working-directory: packages/cli
        run: bun run build

      - name: Build base CLI
        working-directory: base/packages/cli
        run: bun run build

      - name: Point Gutterpress at the runner's system Chrome
        run: |
          echo "CHROMIUM_PATH=$(which google-chrome-stable)" >> $GITHUB_ENV

      - name: Build public fixtures with base + head CLI
        run: |
          set -e
          mkdir -p /tmp/render-parity/base /tmp/render-parity/head
          for fixture in examples/gutterpress-user-guide examples/with-design-guide/book-01 examples/with-design-guide/design-guide; do
            slug=$(basename "$fixture")
            echo "== $fixture (base) =="
            node base/packages/cli/dist/cli.js build "$fixture" --format pdf --out "/tmp/render-parity/base/$slug.pdf"
            echo "== $fixture (head) =="
            node packages/cli/dist/cli.js build "$fixture" --format pdf --out "/tmp/render-parity/head/$slug.pdf"
          done

      - name: Install PDF tools from cache
        uses: ./.github/actions/pdf-tools

      - name: Compare base vs head render for each fixture
        working-directory: packages/cli
        run: |
          status=0
          for fixture in gutterpress-user-guide book-01 design-guide; do
            echo "== $fixture =="
            bun scripts/render-parity.ts compare \
              "/tmp/render-parity/base/$fixture.pdf" \
              "/tmp/render-parity/head/$fixture.pdf" \
              --waive scripts/render-parity-waivers.json \
              --raster "/tmp/render-parity/$fixture-raster" \
              --out "/tmp/render-parity/$fixture-diff.json" || status=$?
          done
          exit $status

      - name: Upload render-parity PDFs + reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: render-parity-public-fixtures
          path: /tmp/render-parity
          if-no-files-found: warn
          retention-days: 3
          compression-level: 0
