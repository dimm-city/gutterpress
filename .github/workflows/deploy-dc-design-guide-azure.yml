name: Deploy dc-design-guide to Azure Static Web Apps

on:
  push:
    branches: [main]
    paths:
      - "examples/dc-design-guide/**"
      - "packages/cli/src/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/deploy-dc-design-guide-azure.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Skip browser downloads during install; this workflow only builds HTML output.
  PUPPETEER_SKIP_DOWNLOAD: "true"
  PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"

jobs:
  build-and-deploy:
    name: Build and deploy dc-design-guide
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build dc-design-guide HTML output
        run: |
          bun packages/cli/src/cli.ts build examples/dc-design-guide \
            --format html \
            --out .azure-static-web-apps/dc-design-guide

      - name: Write Azure SWA routing config and entry point
        run: |
          out=.azure-static-web-apps/dc-design-guide
          # staticwebapp.config.json: runtime navigation fallback so / serves book.html
          cat > "$out/staticwebapp.config.json" <<'EOF'
          {
            "navigationFallback": {
              "rewrite": "/book.html",
              "exclude": ["/css/*", "/fonts/*", "/img/*", "/plugins/*"]
            }
          }
          EOF
          # Minimal index.html — satisfies Azure SWA deploy-time "default file" check.
          # Not the viewer chrome; the viewer only ever loads book.html directly.
          printf '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0;url=book.html"><title>DC Design Guide</title></head><body></body></html>' \
            > "$out/index.html"

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: upload
          app_location: .azure-static-web-apps/dc-design-guide
          output_location: ""
          skip_app_build: true
          azure_static_web_apps_api_token: ${{ secrets.DC_DESIGN_AZURE_STATIC_WEB_APPS_API_TOKEN }}
