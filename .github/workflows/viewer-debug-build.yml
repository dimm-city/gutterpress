name: Viewer debug build (Windows)

# Builds the Windows viewer installer + portable zip from any branch and uploads them as an
# artifact you can download from the Actions tab. Use this for testing
# in-progress branches (like fix/first-render-perf) without cutting a
# release.

on:
  workflow_dispatch:

jobs:
  build:
    name: Build viewer Windows installer + zip
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/bun

      - name: Build viewer Windows installer and zip
        uses: ./.github/actions/build-viewer-windows-zip

      - name: Upload viewer Windows artifacts
        uses: actions/upload-artifact@v6
        with:
          name: viewer-windows-debug-${{ github.sha }}
          path: |
            packages/viewer/dist/*.exe
            packages/viewer/dist/*.zip
          if-no-files-found: error
          retention-days: 14
