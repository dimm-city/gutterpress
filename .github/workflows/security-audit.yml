name: Security audit

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

concurrency:
  group: audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/bun
      - name: Audit the lockfile
        # No install is needed. These unpatched advisories only reach build
        # tooling; remove each exception once its package has a patched release:
        # sprintf-js (GHSA-hp3w-g68c-fv3c) and deepmerge, via
        # @sveltejs/vite-plugin-svelte (GHSA-gcqx-w48m-w2h4).
        run: bun audit --ignore=GHSA-hp3w-g68c-fv3c --ignore=GHSA-gcqx-w48m-w2h4
