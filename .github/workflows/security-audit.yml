name: Security audit

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

concurrency:
  group: audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/bun
      - name: Audit the lockfile
        # No install is needed. These advisories only reach build tooling;
        # remove each exception once the package can move to a patched release:
        # sprintf-js (GHSA-hp3w-g68c-fv3c) and deepmerge, via
        # @sveltejs/vite-plugin-svelte (GHSA-gcqx-w48m-w2h4); glob 9-14.0.1
        # (GHSA-3g3m-2fjr-6pw4: the patch is 14.0.2+, the CLI pins ^13 and
        # htmlhint, rimraf and electron-builder pin older lines); minimatch below
        # 11.0.1 (GHSA-g3hv-75wg-m249: eslint, @typescript-eslint/parser, glob and
        # electron-builder pin the 3.x-10.x lines).
        run: bun audit --ignore=GHSA-hp3w-g68c-fv3c --ignore=GHSA-gcqx-w48m-w2h4 --ignore=GHSA-3g3m-2fjr-6pw4 --ignore=GHSA-g3hv-75wg-m249
