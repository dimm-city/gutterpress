name: Test Windows Installation Script

on:
  workflow_dispatch:
    inputs:
      script_ref:
        description: 'Git ref (branch/tag) to test install script from'
        required: false
        default: 'main'
        type: string
  pull_request:
    paths:
      - 'scripts/install.ps1'
      - '.github/workflows/windows-install-test.yml'
  workflow_call:
    inputs:
      script_ref:
        description: 'Git ref (branch/tag) to test install script from'
        required: false
        default: 'main'
        type: string

jobs:
  windows-install:
    name: Windows install test
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.script_ref || github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        shell: pwsh
        run: bun install --frozen-lockfile

      - name: Build standalone binary for windows-x64
        shell: pwsh
        run: bun scripts/compile.ts bun-windows-x64 print-md-windows-x64.exe

      - name: Run install script (with local binary)
        shell: pwsh
        env:
          # Skip the GitHub Release download — verify the binary this branch
          # actually produces, not whatever is in the latest published release.
          PRINTMD_LOCAL_BINARY: ${{ github.workspace }}\print-md-windows-x64.exe
          # Still set the workflow token in case anything still needs it
          # (e.g. future installer steps that talk to the API).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/install.ps1

      - name: Verify installation
        shell: pwsh
        run: ./tests/integration/run-install-test.ps1 -SkipInstall

      - name: Upload debug logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-install-debug
          path: |
            ${{ runner.temp }}\*.log
            ${{ env.USERPROFILE }}\.bun\install\debug.log
          if-no-files-found: ignore
          retention-days: 7
