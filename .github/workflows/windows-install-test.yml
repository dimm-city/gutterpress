name: Test Windows Installation Script

on:
  workflow_dispatch:
    inputs:
      script_ref:
        description: 'Git ref (branch/tag) to test install script from'
        required: false
        default: 'main'
        type: string
  pull_request:
    paths:
      - 'scripts/install.ps1'
      - 'packages/cli/tests/integration/**'
      - 'packages/lib/src/lib/embedded-assets.ts'
      - '.github/workflows/windows-install-test.yml'
  workflow_call:
    inputs:
      script_ref:
        description: 'Git ref (branch/tag) to test install script from'
        required: false
        default: 'main'
        type: string
      use_artifact:
        description: 'Download the pre-built windows binary artifact instead of rebuilding from source'
        required: false
        default: false
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  windows-install:
    name: Windows install test
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.script_ref || github.ref }}

      # ── Build path: compile binary from source (standalone run or PR) ────────
      - name: Setup Bun
        if: ${{ !inputs.use_artifact }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        if: ${{ !inputs.use_artifact }}
        shell: pwsh
        run: bun install --frozen-lockfile

      - name: Build standalone binary for windows-x64
        if: ${{ !inputs.use_artifact }}
        shell: pwsh
        run: bun --cwd packages/cli scripts/compile.ts bun-windows-x64 ../../print-md-cli-windows-x64.exe

      # ── Artifact path: download binary built by the release workflow ─────────
      - name: Download pre-built windows binary
        if: ${{ inputs.use_artifact }}
        uses: actions/download-artifact@v4
        with:
          name: print-md-cli-windows-x64.exe
          path: .

      - name: Smoke-test binary directly
        shell: pwsh
        run: |
          $exe = "${{ github.workspace }}\print-md-cli-windows-x64.exe"
          Write-Host "Binary: $exe"
          Write-Host "Size: $((Get-Item $exe).Length) bytes"
          Write-Host "---- print-md --version ----"
          & $exe --version
          $code = $LASTEXITCODE
          Write-Host "---- exit=$code ----"
          if ($code -ne 0) { throw "print-md --version exited $code" }

      - name: Run install script (with local binary)
        shell: pwsh
        env:
          PRINTMD_LOCAL_BINARY: ${{ github.workspace }}\print-md-cli-windows-x64.exe
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./packages/cli/scripts/install.ps1

      - name: Verify installation
        shell: pwsh
        run: .\packages\cli\tests\integration\run-install-test.ps1 -SkipInstall

      - name: Build HTML output from smoke fixture
        shell: pwsh
        run: |
          # Use the installed binary if present, fall back to the workspace exe.
          $installed = "$env:LOCALAPPDATA\Programs\print-md\print-md.exe"
          $workspace = "${{ github.workspace }}\print-md-cli-windows-x64.exe"
          $exe = if (Test-Path $installed) { $installed } else { $workspace }
          Write-Host "Binary: $exe"

          $fixtureDir = "${{ github.workspace }}\packages\cli\tests\integration\fixtures\smoke"
          $outDir = "${{ runner.temp }}\smoke-out"
          Write-Host "Building: $exe build $fixtureDir --format html --out $outDir"
          & $exe build $fixtureDir --format html --out $outDir
          if ($LASTEXITCODE -ne 0) { throw "print-md build --format html exited $LASTEXITCODE" }

          $expected = @("book.html", "vendor\paged.polyfill.js", "preview\scripts\pagedjs-interface.js", "preview\scripts\pagedjs-bridge.js")
          foreach ($f in $expected) {
            $path = Join-Path $outDir $f
            if (-not (Test-Path $path)) { throw "Expected output missing: $path" }
            Write-Host "OK: $f"
          }

      - name: Upload debug logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-install-debug
          path: |
            ${{ runner.temp }}\*.log
            ${{ env.USERPROFILE }}\.bun\install\debug.log
          if-no-files-found: ignore
          retention-days: 7
