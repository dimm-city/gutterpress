name: Test Windows Installation Script

on:
  workflow_dispatch:
    inputs:
      script_ref:
        description: 'Git ref (branch/tag) to test install script from'
        required: false
        default: 'main'
        type: string
  pull_request:
    paths:
      - 'scripts/install.ps1'
      - 'packages/cli/tests/integration/**'
      - 'packages/cli/src/lib/embedded-assets.ts'
      - '.github/workflows/windows-install-test.yml'
  workflow_call:
    inputs:
      script_ref:
        description: 'Git ref (branch/tag) to test install script from'
        required: false
        default: 'main'
        type: string

jobs:
  windows-install:
    name: Windows install test
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.script_ref || github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        shell: pwsh
        run: bun install --frozen-lockfile

      - name: Build standalone binary for windows-x64
        shell: pwsh
        run: bun --cwd packages/cli scripts/compile.ts bun-windows-x64 ../../print-md-cli-windows-x64.exe

      - name: Smoke-test binary directly
        shell: pwsh
        # Run the freshly-built binary BEFORE install.ps1 wraps anything.
        # This surfaces the raw stderr in the CI step output if it crashes,
        # rather than being masked by run-install-test.ps1's error handling.
        run: |
          $exe = "${{ github.workspace }}\print-md-cli-windows-x64.exe"
          Write-Host "Binary: $exe"
          Write-Host "Size: $((Get-Item $exe).Length) bytes"
          Write-Host "---- print-md --version ----"
          & $exe --version
          $code = $LASTEXITCODE
          Write-Host "---- exit=$code ----"
          if ($code -ne 0) { throw "print-md --version exited $code" }

      - name: Run install script (with local binary)
        shell: pwsh
        env:
          # Skip the GitHub Release download — verify the binary this branch
          # actually produces, not whatever is in the latest published release.
          PRINTMD_LOCAL_BINARY: ${{ github.workspace }}\print-md-cli-windows-x64.exe
          # Still set the workflow token in case anything still needs it
          # (e.g. future installer steps that talk to the API).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./packages/cli/scripts/install.ps1

      - name: Verify installation
        shell: pwsh
        run: .\packages\cli\tests\integration\run-install-test.ps1 -SkipInstall

      - name: Build HTML output from smoke fixture
        shell: pwsh
        run: |
          # Use the installed binary if present, fall back to the freshly-built exe.
          $installed = "$env:LOCALAPPDATA\Programs\print-md\print-md.exe"
          $workspace = "${{ github.workspace }}\print-md-cli-windows-x64.exe"
          $exe = if (Test-Path $installed) { $installed } else { $workspace }
          Write-Host "Binary: $exe"

          $fixtureDir = "${{ github.workspace }}\packages\cli\tests\integration\fixtures\smoke"
          $outDir = "${{ runner.temp }}\smoke-out"
          Write-Host "Building: $exe build $fixtureDir --format html --out $outDir"
          & $exe build $fixtureDir --format html --out $outDir
          if ($LASTEXITCODE -ne 0) { throw "print-md build --format html exited $LASTEXITCODE" }

          # Verify all expected output files are present.
          $expected = @("book.html", "vendor\paged.polyfill.js", "preview\scripts\pagedjs-interface.js", "preview\scripts\pagedjs-bridge.js")
          foreach ($f in $expected) {
            $path = Join-Path $outDir $f
            if (-not (Test-Path $path)) { throw "Expected output missing: $path" }
            Write-Host "OK: $f"
          }

      - name: Verify Paged.js renders (smoke)
        shell: pwsh
        run: |
          # Install playwright (library only — no browser download; uses system Chrome).
          $pwDir = "${{ runner.temp }}\pw"
          New-Item -ItemType Directory -Force -Path $pwDir | Out-Null
          Set-Location $pwDir
          npm init -y | Out-Null
          npm install playwright 2>&1 | Where-Object { $_ -notmatch "^npm warn" }

          # Find system Chrome — present on all windows-latest runners.
          $chromePaths = @(
            "C:\Program Files\Google\Chrome\Application\chrome.exe",
            "C:\Program Files (x86)\Google\Chrome\Application\chrome.exe",
            "$env:LOCALAPPDATA\Google\Chrome\Application\chrome.exe"
          )
          $chrome = $chromePaths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $chrome) { throw "No system Chrome found on this runner" }
          Write-Host "Chrome: $chrome"

          $outDir = "${{ runner.temp }}\smoke-out"
          $script = "${{ github.workspace }}\packages\cli\tests\integration\paged-smoke.mjs"
          Set-Location $pwDir
          node $script $outDir --chrome-path $chrome
          if ($LASTEXITCODE -ne 0) { throw "Paged.js render smoke test failed — see output above" }

      - name: Upload debug logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-install-debug
          path: |
            ${{ runner.temp }}\*.log
            ${{ env.USERPROFILE }}\.bun\install\debug.log
          if-no-files-found: ignore
          retention-days: 7
