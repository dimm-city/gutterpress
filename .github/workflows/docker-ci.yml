name: Docker Build Check

# The production image is published fire-and-forget from release.yml (a
# `gh workflow run docker.yml` dispatch with no follow-up), so a Dockerfile
# break would be invisible until a release. This job builds the image (NO
# push) at PR time so a broken Dockerfile fails review.
# Path-filtered so it only runs when something that can affect the build changes
# — not on doc-only PRs.

on:
  pull_request:
    paths: &docker-paths
      - 'Dockerfile'
      - '.dockerignore'
      - 'packages/cli/src/**'
      - '!packages/cli/src/**/*.test.ts'
      - '!packages/cli/src/test-helpers/**'
      - 'packages/cli/scripts/**'
      - 'packages/cli/tsconfig*.json'
      - 'packages/*/package.json'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/docker-ci.yml'
  push:
    branches: [main, develop]
    paths: *docker-paths

concurrency:
  group: docker-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docker-build:
    name: Docker image builds (no push)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Native-arch build only (docker.yml does multi-arch on publish); this
      # only needs to prove the Dockerfile still builds.
      # Cache policy: PR-scoped GHA caches are write-only
      # waste — no other ref can read them, and mode=max layer sets are large
      # enough to evict the shared main-branch cache. So PRs only CONSUME the
      # cache (cache-from) while pushes to main/develop refresh it (cache-to).
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max' || '' }}
