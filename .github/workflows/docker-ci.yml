name: Docker Build Check

# audit F4: the production image is published fire-and-forget from release.yml
# (a `gh workflow run docker.yml` dispatch with no follow-up), so a Dockerfile
# break was invisible until a release and never caught on a normal PR. This job
# builds the image (NO push) at PR time so a broken Dockerfile fails review.
# Path-filtered so it only runs when something that can affect the build changes
# — not on doc-only PRs.

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'packages/cli/**'
      - 'package.json'
      - 'bun.lock'
  push:
    branches: [main, develop]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'packages/cli/**'
      - 'package.json'
      - 'bun.lock'

jobs:
  docker-build:
    name: Docker image builds (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Native-arch build only (the release workflow still does multi-arch on
      # publish); this only needs to prove the Dockerfile still builds. GHA
      # layer cache keeps unchanged rebuilds fast.
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
