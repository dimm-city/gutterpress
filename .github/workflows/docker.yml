name: Docker image

# Builds and publishes the Gutterpress CLI container to GitHub Container Registry.
# Multi-arch (amd64 + arm64) via QEMU/buildx.
#
# workflow_dispatch is the ONLY trigger: release.yml's github-release job
# dispatches this workflow at the release tag after creating the GitHub
# release (an explicit dispatch because GitHub suppresses workflow-triggering
# events from anything created with a workflow's own GITHUB_TOKEN). The former
# `release: published` trigger could only ever fire for a hand-published
# release, which shouldn't exist — release.yml is the single publish path —
# so it was removed rather than left as a way to push a container by
# accident.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. 1.2.3 or test)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/dimm-city/gutterpress
          tags: |
            # Semver tags (X.Y.Z + the X.Y moving tag) apply when the run is
            # at a v* tag ref — release.yml dispatches with `--ref v<version>`.
            # metadata-action skips the moving tags for prerelease versions.
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # `latest` for stable versions only: no '-' in the tag, running AT
            # the matching release tag ref. The ref match keeps ad-hoc
            # dispatches (e.g. tag "test" from a branch) from ever
            # overwriting `latest`.
            type=raw,value=latest,enable=${{ !contains(inputs.tag, '-') && github.ref == format('refs/tags/v{0}', inputs.tag) }}
            type=raw,value=${{ inputs.tag }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
