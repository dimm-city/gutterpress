name: Docker image

# Builds and publishes the print-md CLI container to GitHub Container Registry.
# Multi-arch (amd64 + arm64) via QEMU/buildx.
#
# NORMAL PATH: release.yml's github-release job dispatches this workflow at
# the release tag after creating the GitHub release. The `release: published`
# trigger below can only fire for manually-published releases — releases
# created by release.yml use GITHUB_TOKEN, whose events GitHub suppresses
# (workflow_dispatch is the documented exception).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. 1.2.3 or test)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/print-md
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # `latest` for stable versions only: release events that aren't
            # prereleases, or dispatches for a stable version (no '-' in the
            # tag) running AT the matching release tag ref — release.yml
            # dispatches with `--ref v<version> -f tag=<version>`. The ref
            # match keeps ad-hoc dispatches (e.g. tag "test" from a branch)
            # from ever overwriting `latest`.
            type=raw,value=latest,enable=${{ (github.event_name == 'release' && github.event.release.prerelease == false) || (github.event_name == 'workflow_dispatch' && !contains(inputs.tag, '-') && github.ref == format('refs/tags/v{0}', inputs.tag)) }}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
