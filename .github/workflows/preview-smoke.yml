
name: Preview smoke

# Guards that `gutterpress preview` still boots and that the native viewer
# actually paginates the shipped example projects in Chromium: `gp:layout`
# fires, page count > 0 and agrees with the event, no collapsed sheets, no
# uncaught page errors.
#
# Chromium is the only engine tested — Gutterpress supports Chrome and other
# Chromium-based browsers and nothing else (CLAUDE.md, ratified 2026-08-23).
# The firefox/webkit legs, and the cross-engine page-count comparison that was
# their whole point, were removed with that ruling.

on:
  pull_request:
    branches: [main, develop, "release/**"]
    paths:
      - "packages/cli/src/**"
      - "packages/cli/tests/compat/**"
      - "examples/**"
  workflow_dispatch:

env:
  PUPPETEER_SKIP_DOWNLOAD: "true"
  PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"

jobs:
  preview-smoke:
    name: Native preview smoke (chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun (cached)
        uses: ./.github/actions/bun

      - name: Install dependencies
        run: bun install

      - name: Build lib
        run: bun run build

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('packages/cli/package.json') }}

      - name: Install Playwright Chromium
        working-directory: packages/cli
        run: node_modules/.bin/playwright install --with-deps chromium

      - name: Run preview smoke test
        working-directory: packages/cli
        run: node_modules/.bin/playwright test -c tests/compat/playwright.config.ts
        env:
          # Surface each webServer's spawn/readiness/exit (incl. exit code) so
          # a bare "Process from config.webServer exited early" is diagnosable
          # from the job log instead of unreproducible-flake guesswork.
          DEBUG: "pw:webserver"
