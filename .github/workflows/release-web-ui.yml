name: Release Web UI Bundle

# Publishes the SvelteKit static bundle as a GitHub Release on the web-v* tag
# line — completely separate from the full-installer release (v* tags).
#
# Each release produces exactly three assets:
#   web-ui-bundle.zip         — zip of packages/viewer/build/ contents (index.html at root)
#   update-manifest.json      — manifest contract (schemaVersion:1, sha256, size, …)
#   update-manifest.json.sig  — Ed25519 signature of the manifest bytes (base64)
#
# Required GitHub Actions secret:
#   WEB_UI_SIGNING_KEY  — Ed25519 private key in PKCS8 PEM format.
#                         Generate with: openssl genpkey -algorithm ed25519 -out key.pem
#                         Upload the PEM contents to: Settings → Secrets → Actions.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Web UI version to release (e.g. 0.2.1). Creates/pushes tag web-v<version>."
        required: true
        type: string

  push:
    tags:
      - 'web-v*'

env:
  PUPPETEER_SKIP_DOWNLOAD: 'true'
  PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  release-web-ui:
    name: Build & Release Web UI Bundle
    runs-on: ubuntu-latest

    steps:
      # ── 1. Resolve version ─────────────────────────────────────────────────
      #
      # When triggered by workflow_dispatch we derive the version from the input
      # and create the tag. When triggered by a push of a web-v* tag we parse
      # the version from the tag name.

      - name: Resolve version and tag name
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            # Strip the leading "web-v" prefix from the pushed tag ref.
            VERSION="${GITHUB_REF_NAME#web-v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=web-v$VERSION"  >> "$GITHUB_OUTPUT"

      # ── 2. Checkout ────────────────────────────────────────────────────────

      - uses: actions/checkout@v5
        with:
          # For workflow_dispatch we check out the default branch and will
          # create the tag below. For tag pushes the ref is already the tag.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.default_branch || github.ref }}

      # ── 3. Create and push tag (workflow_dispatch only) ────────────────────

      - name: Create and push web-v tag
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Delete any stale local/remote tag with the same name so a re-run
          # always points the tag at the current HEAD.
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git tag -d "$TAG"
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git push origin ":refs/tags/$TAG"
          fi

          git tag "$TAG"
          git push origin "$TAG"

      # ── 4. Setup Bun ───────────────────────────────────────────────────────

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # ── 5. Install dependencies ────────────────────────────────────────────

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ── 6. Build SvelteKit static bundle ──────────────────────────────────
      #
      # Output goes to packages/viewer/build/ (adapter-static, see svelte.config.js).

      - name: Build SvelteKit static bundle
        working-directory: packages/viewer
        run: bun run build

      # ── 7. Zip bundle contents (index.html at zip root) ────────────────────

      - name: Zip web UI bundle
        run: |
          cd packages/viewer/build
          zip -r ../web-ui-bundle.zip .
          echo "Zip created: $(ls -lh ../web-ui-bundle.zip | awk '{print $5, $9}')"

      # ── 8. Generate manifest + signature ───────────────────────────────────
      #
      # Requires the WEB_UI_SIGNING_KEY secret (Ed25519 PKCS8 PEM).
      # Writes update-manifest.json and update-manifest.json.sig next to the zip.

      - name: Generate update manifest and signature
        run: node scripts/build-web-ui-manifest.mjs packages/viewer/web-ui-bundle.zip
        env:
          WEB_UI_VERSION: ${{ steps.ver.outputs.version }}
          WEB_UI_SIGNING_KEY: ${{ secrets.WEB_UI_SIGNING_KEY }}

      # ── 9. Create GitHub Release ───────────────────────────────────────────

      - name: Create GitHub Release
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          VERSION="${{ steps.ver.outputs.version }}"
          REPO="${{ github.repository }}"

          PRERELEASE_FLAG=""
          if [[ "$VERSION" == *"-"* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          # Delete any existing release for this tag so re-runs are idempotent.
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Deleting existing release $TAG to recreate with current assets..."
            gh release delete "$TAG" --yes --repo "$REPO"
          fi

          # Build release notes in a file (avoids embedding newlines in the
          # YAML run block, which breaks the literal scalar).
          printf '%s\n' \
            "Automated web UI bundle release for version ${VERSION}." \
            "" \
            "Assets:" \
            "- web-ui-bundle.zip — SvelteKit static build (index.html at zip root)" \
            "- update-manifest.json — update manifest (schemaVersion 1)" \
            "- update-manifest.json.sig — Ed25519 signature of the manifest" \
            > /tmp/web-ui-release-notes.md

          gh release create "$TAG" \
            --repo "$REPO" \
            --title "Web UI $TAG" \
            --notes-file /tmp/web-ui-release-notes.md \
            $PRERELEASE_FLAG \
            packages/viewer/web-ui-bundle.zip \
            packages/viewer/update-manifest.json \
            packages/viewer/update-manifest.json.sig
        env:
          GH_TOKEN: ${{ github.token }}
