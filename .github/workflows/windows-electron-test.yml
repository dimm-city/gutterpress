name: Windows Electron driver test

# Launches the packaged Electron viewer .exe on windows-latest via
# Playwright and drives the full directory-load flow:
#   1. Wait for the SvelteKit server window to open
#   2. POST /api/preview from the renderer with a real Windows fixture path
#   3. Verify the returned URL serves book.html
#
# If this passes, the directory-load failure is NOT in the lib, NOT in
# the HTTP API, and NOT in the Electron shell — the entire stack is
# proven to work on Windows end-to-end.

on:
  push:
    branches: [main]
    paths:
      - 'packages/viewer/**'
      - 'packages/lib/**'
      - '.github/workflows/windows-electron-test.yml'
  pull_request:
    paths:
      - 'packages/viewer/**'
      - 'packages/lib/**'
      - '.github/workflows/windows-electron-test.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PUPPETEER_SKIP_DOWNLOAD: 'true'
  PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'

jobs:
  test:
    name: Drive packaged Electron app on Windows
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install workspace deps
        run: bun install --frozen-lockfile

      - name: Build lib dist
        working-directory: packages/lib
        run: bun run build

      - name: Build and package the viewer
        working-directory: packages/viewer
        run: npm run dist:win

      - name: Extract zip artifact (mirror what users get)
        id: locate
        shell: pwsh
        run: |
          # Test the actual zip artifact that ships to users, NOT the
          # dist/win-unpacked tree (electron-builder's intermediate output).
          # afterPack-related issues that affect npm install ordering only
          # surface in the final zip — this catches that class of bug.
          $zip = Get-ChildItem "${{ github.workspace }}\packages\viewer\dist\*-win.zip" | Select-Object -First 1
          if (-not $zip) { throw "no *-win.zip found in dist/" }
          Write-Host "zip: $($zip.FullName) ($([math]::Round($zip.Length/1MB,1))MB)"

          $extract = "${{ runner.temp }}\viewer-extracted"
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $extract -Force

          $exe = Join-Path $extract "print-md-viewer.exe"
          if (-not (Test-Path $exe)) { throw "exe not found at $exe after extraction" }

          # Sanity check: verify the lib bundle is shipped in the zip.
          # The lib is now bundled into electron-dist/lib.cjs (no
          # node_modules/@dimm-city/print-md-lib package on disk).
          $libBundle = Join-Path $extract "resources\app\electron-dist\lib.cjs"
          if (-not (Test-Path $libBundle)) {
            throw "MISSING: $libBundle — build-electron.ts did not bundle the lib"
          }
          Write-Host "lib bundle present: $libBundle"

          "exe=$exe" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Install playwright in isolated dir
        shell: pwsh
        run: |
          # We need playwright to drive Electron. Install it standalone
          # outside the workspace tree to avoid `workspace:*` conflicts.
          $pwDir = "${{ runner.temp }}\pw"
          New-Item -ItemType Directory -Force -Path $pwDir | Out-Null
          Set-Location $pwDir
          '{"name":"_etest","version":"0.0.0","private":true,"type":"module"}' | Set-Content -Encoding utf8 "package.json"
          npm install playwright --no-save --no-package-lock --ignore-scripts 2>&1 | Where-Object { $_ -notmatch "^npm warn" }
          # Copy the test script alongside node_modules so ESM resolves.
          Copy-Item "${{ github.workspace }}\packages\viewer\tests\integration\electron-driver.test.mjs" "$pwDir\electron-driver.test.mjs"

      - name: Drive the viewer end-to-end
        shell: pwsh
        run: |
          $pwDir = "${{ runner.temp }}\pw"
          $fixture = "${{ github.workspace }}\packages\cli\tests\integration\fixtures\smoke"
          node "$pwDir\electron-driver.test.mjs" "${{ steps.locate.outputs.exe }}" $fixture

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: electron-test-debug
          path: |
            packages/viewer/dist/*.log
            packages/viewer/dist/win-unpacked/resources/app/**/*.json
          if-no-files-found: ignore
          retention-days: 7
