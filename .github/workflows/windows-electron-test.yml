name: Windows Electron driver test

# Builds the packaged Electron viewer .exe on windows-latest and runs the
# committed UI test suite (packages/viewer/tests/integration/*.test.mjs) against
# it via Playwright (playwright-core devDependency). Covers:
#   - the full directory-load flow (renderer → preview server → book.html)
#   - editor↔preview chapter-dropdown sync (the dropdown must move the editor
#     across chapters, not just the preview)
#   - the full History-tab sync scenario (sync-history.pw.mjs): app-path clone
#     of a multi-book repo subfolder, fetch-on-open modal, Check/Get/Send,
#     push-when-behind, and the safeStorage credential-store round-trip —
#     against the lib's in-process git smart-HTTP test server (no system git).
# Proves the whole stack works on Windows end-to-end.

on:
  # Manual + release-time only: Windows runners bill 2x minutes, and the
  # per-push signal belongs to the Linux suites. Run before releases or when
  # touching git/sync/electron platform code (user cost mandate 2026-06-11).
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PUPPETEER_SKIP_DOWNLOAD: 'true'
  PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'

jobs:
  test:
    name: Drive packaged Electron app on Windows
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/bun

      - name: Build viewer Windows zip
        uses: ./.github/actions/build-viewer-windows-zip

      - name: Extract zip artifact (mirror what users get)
        id: locate
        shell: pwsh
        run: |
          # Test the actual zip artifact that ships to users, NOT the
          # dist/win-unpacked tree (electron-builder's intermediate output).
          # afterPack-related issues that affect npm install ordering only
          # surface in the final zip — this catches that class of bug.
          $zip = Get-ChildItem "${{ github.workspace }}\packages\viewer\dist\*-win.zip" | Select-Object -First 1
          if (-not $zip) { throw "no *-win.zip found in dist/" }
          Write-Host "zip: $($zip.FullName) ($([math]::Round($zip.Length/1MB,1))MB)"

          $extract = "${{ runner.temp }}\viewer-extracted"
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $extract -Force

          $exe = Join-Path $extract "print-md-viewer.exe"
          if (-not (Test-Path $exe)) { throw "exe not found at $exe after extraction" }

          # Sanity check: the app is packed into an asar archive (the lib, incl.
          # its embedded assets, ships inside it; puppeteer-core is unpacked).
          $asar = Join-Path $extract "resources\app.asar"
          if (-not (Test-Path $asar)) {
            throw "MISSING: $asar — app not packaged into asar correctly"
          }
          $pptr = Join-Path $extract "resources\app.asar.unpacked\node_modules\puppeteer-core"
          if (-not (Test-Path $pptr)) {
            throw "MISSING: $pptr — puppeteer-core should be asar-unpacked"
          }
          Write-Host "asar present: $asar; puppeteer-core unpacked"

          "exe=$exe" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Run the viewer UI test suite
        shell: pwsh
        # playwright-core is a viewer devDependency (installed by the build
        # step's `bun install`), so the committed runner drives the packaged exe
        # directly — no ad-hoc install or file-copy. It runs every
        # tests/integration/*.test.mjs (directory-load + editor↔preview sync).
        run: bun --cwd packages/viewer run test:ui -- "${{ steps.locate.outputs.exe }}"

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: electron-test-debug
          path: |
            packages/viewer/dist/*.log
            packages/viewer/dist/win-unpacked/resources/app/**/*.json
          if-no-files-found: ignore
          retention-days: 7
