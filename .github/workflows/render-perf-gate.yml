name: Gutterpress desktop app gates

# One job: the behaviour drives — real-Electron acceptance checks that launch
# the built app under xvfb and assert user-visible behaviour. They stay because
# they are the only gate class with a record of catching shipped bugs: two
# user-facing defects passed 2117 desktop + 1845 CLI unit tests in one cycle
# and were caught only by driving the app.
#
# The render-perf job (render-gate.mjs pages-per-second + rerender-latency-gate
# --strict) was REMOVED 2026-08-30 on the owner's call. Its record over its
# lifetime: the render-speed gate's failures were 100% infrastructure — the
# regression signature it existed to catch ("render rate 0.00 pp/s") appeared
# in NONE of its 8 recorded failures — and the rerender gate never fired once
# in 577 runs. Both consumed a runner per PR and a recurring flake surface.
# Do not resurrect a wall-clock performance gate on shared CI runners without
# a record of a real regression it would have caught.
#
# The file keeps its render-perf-gate.yml name because drive scripts and docs
# cite it by path.

on:
  pull_request:
    branches: [main, develop, "release/**"]
    paths:
      - "packages/desktop/src/**"
      - "packages/desktop/electron/**"
      - "packages/cli/src/preview/**"
      - "packages/cli/src/assets/preview/**"
      - "packages/cli/src/lib/markdown/**"
      # The viewer engine and the bundle built from it. These decide what the
      # desktop app actually paints, so a change here can break the app while
      # every filter above stays untouched — which is exactly what happened:
      # a2da1e1 shipped a spread-mode regression in 0.10.2 (every page's
      # content drawn one slot off its own sheet, page 1 on bare stage with no
      # @page background), and neither that commit nor its fix (7b8c79cb) ever
      # triggered these gates. Do not remove: the desktop app's own gates must
      # run when the desktop app's renderer changes.
      - "packages/cli/src/engine/viewer/**"
      - "packages/cli/src/assets/engine/**"
      - "packages/desktop/static/engine/**"
      - "packages/desktop/tests/integration/**"
      - ".github/workflows/render-perf-gate.yml"
  workflow_dispatch:

env:
  PUPPETEER_SKIP_DOWNLOAD: "true"
  PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"

jobs:
  behaviour:
    name: App behaviour (xvfb)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun (cached)
        uses: ./.github/actions/bun

      - name: Install dependencies
        run: bun install

      - name: Build lib
        run: bun run build

      - name: Build desktop (SPA + electron main)
        working-directory: packages/desktop
        run: |
          npm run build
          npm run electron:build

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # One xvfb-run per drive. The two CDP drives fall back to wrapping
      # themselves in xvfb-run when DISPLAY is unset; wrapping them here sets
      # DISPLAY, so that fallback stays dormant and every drive launches the
      # same way. problems-last-hop and editor-dropdown-sync drive Playwright's
      # _electron, which has no such fallback and need the wrapper.
      - name: Drive the built app (behaviour)
        working-directory: packages/desktop
        run: |
          xvfb-run -a node tests/integration/problems-last-hop.pw.mjs out/main/main.js
          xvfb-run -a node tests/integration/app-lifecycle-log.pw.mjs out/main/main.js
          xvfb-run -a node tests/integration/editor-toggle-loads-module.pw.mjs
          xvfb-run -a node tests/integration/panel-reopen-on-failed-open.pw.mjs
          xvfb-run -a node tests/integration/problems-panel.pw.mjs
          xvfb-run -a node tests/integration/editor-opens-with-content.pw.mjs
          xvfb-run -a node tests/integration/editor-dropdown-sync.pw.mjs out/main/main.js
