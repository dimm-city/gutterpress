
name: Gutterpress desktop app gates

# This job builds the desktop app once and then runs every gate that needs a
# LIVE app: the render-speed gates first, then the behaviour drives (see the
# note on that step for why that order). The file keeps its
# render-perf-gate.yml name because tests/perf/render-gate.mjs and
# tests/integration/inline-editing.pw.mjs cite it by path.
#
# ── Behaviour drives ────────────────────────────────────────────────────────
# packages/desktop/tests/integration/*.pw.mjs launch the real Electron app and
# assert real behaviour. Until now they ran in NO workflow, while two shipped
# user-facing bugs slipped past 2117 desktop + 1845 CLI unit tests this cycle —
# both were caught only by driving the app. Three of the seven drives are gated
# here; the other four are excluded on evidence, not oversight:
#
#   gated (each measured green over repeated local runs):
#     problems-last-hop            ~2-7s   marker diagnostics + click-to-source
#     editor-toggle-loads-module   ~5s     edit toggle, autosave delay, Ctrl+S
#     panel-reopen-on-failed-open  ~2-4s   never-stranded after a failed open
#
#   excluded — deterministically red against current code (stale assertions,
#   NOT flakes; gating them would just train everyone to ignore red):
#     problems-panel     expects sev-error for a missing local image; the app
#                        now reports sev-warning ("will substitute a magenta
#                        placeholder").
#     inline-editing     12/14 checks pass; checks 11-12 wait 30s each on
#                        summary[aria-label="Edit or read"], a selector that no
#                        longer exists anywhere in packages/desktop/src.
#
#   excluded — need an electron-builder AppImage, which this job does not build
#   (both pass 3/3 against a locally packaged 0.10.1 AppImage, so they are
#   healthy — just expensive here):
#     electron-driver        hardcodes executablePath; ~zero marginal coverage
#                            anyway, since every gated drive already proves the
#                            SPA renders before asserting anything.
#     editor-dropdown-sync   hardcodes executablePath; DOES have unique
#                            coverage (outline<->editor sync). Teaching it the
#                            `isMainJs ? require_("electron") : target` pattern
#                            the gated three already use would let it join this
#                            job for ~5s instead of a multi-minute packaging
#                            step plus a network dependency on the AppImage
#                            tooling download.
#
# Note the two CDP drives (editor-toggle, panel-reopen) leak their Electron
# process on exit and pick CDP ports at random from narrow ranges, so
# back-to-back local reruns eventually collide and fail with "CDP endpoint
# never appeared". That is a rerun artifact, not drive flake: one run per fresh
# environment — which is what CI does — measured 16/16 green. Kill strays
# between local reruns.
#
# ── Render-speed gates ──────────────────────────────────────────────────────
# Catches the v0.4.1..v0.5.0-rc.3 class of regression: hiding the cross-origin
# preview iframe (opacity:0 / opaque cover) makes Chromium render-throttle it
# to ~1fps, so viewer layout crawls at ~1 page/sec instead of 10-30+.
# Fix tag: render-fix-iframe-visibility.
#
# Verified 2026-06-10 that the throttle reproduces identically under xvfb-run
# (broken ≈1.0 pp/s, healthy ≈20 pp/s) — it keys off iframe visibility, not
# GPU/display — so this gate is valid headless. (The window-level show:false
# throttle is a DIFFERENT bug class that xvfb cannot reproduce; this gate does
# not claim to cover it.)

on:
  pull_request:
    branches: [main, develop, "release/**"]
    paths:
      - "packages/desktop/src/**"
      - "packages/desktop/electron/**"
      - "packages/cli/src/preview/**"
      - "packages/cli/src/assets/preview/**"
      - "packages/cli/src/lib/markdown/**"
      - "packages/desktop/tests/perf/**"
      - "packages/desktop/tests/integration/**"
      - ".github/workflows/render-perf-gate.yml"
  workflow_dispatch:

env:
  PUPPETEER_SKIP_DOWNLOAD: "true"
  PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"

jobs:
  desktop-gates:
    name: App behaviour + render speed (xvfb)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun (cached)
        uses: ./.github/actions/bun

      - name: Install dependencies
        run: bun install

      - name: Build lib
        run: bun run build

      - name: Build desktop (SPA + electron main)
        working-directory: packages/desktop
        run: |
          npm run build
          npm run electron:build

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run render-perf gate
        working-directory: packages/desktop
        # No DISPLAY on the runner → the gate wraps electron in xvfb-run itself.
        run: node tests/perf/render-gate.mjs

      # v0.8.3 fast-path contract: a Markdown save must render /__chapter in
      # place, not request a replacement book.html, and must stay far below the
      # multi-second full-document regression. Reuses the app built above.
      - name: Run instant-preview regression gate
        working-directory: packages/desktop
        run: node tests/perf/rerender-latency-gate.mjs --strict --max-ms 1000

      # LAST, deliberately. Each drive leaks its Electron process on exit
      # (measured: problems-last-hop does not, the other two do), and the gates
      # above measure latency on a 2-core runner — leaving stray Electron apps
      # running before them is exactly the kind of interference that turns a
      # reliable gate flaky. Running behaviour last means the perf gates keep
      # the pristine runner they have been green on, and the leak lands where
      # nothing can be affected by it: the end of the job.
      #
      # One xvfb-run per drive. The two CDP drives fall back to wrapping
      # themselves in xvfb-run when DISPLAY is unset; wrapping them here sets
      # DISPLAY, so that fallback stays dormant and all three launch the same
      # way. problems-last-hop drives Playwright's _electron, which has no
      # such fallback and needs the wrapper.
      - name: Drive the built app (behaviour)
        working-directory: packages/desktop
        run: |
          xvfb-run -a node tests/integration/problems-last-hop.pw.mjs out/main/main.js
          xvfb-run -a node tests/integration/editor-toggle-loads-module.pw.mjs
          xvfb-run -a node tests/integration/panel-reopen-on-failed-open.pw.mjs
