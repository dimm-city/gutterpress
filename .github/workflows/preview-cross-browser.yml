
name: Preview cross-browser smoke

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "packages/cli/src/**"
      - "packages/cli/tests/compat/**"
      - "examples/**"
  workflow_dispatch:

env:
  PUPPETEER_SKIP_DOWNLOAD: "true"
  PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"

jobs:
  preview-smoke:
    name: Paged.js preview smoke (chromium + firefox + webkit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun (cached)
        uses: ./.github/actions/bun

      - name: Install dependencies
        run: bun install

      - name: Build lib
        run: bun run build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('packages/cli/package.json') }}

      - name: Install Playwright browsers
        working-directory: packages/cli
        run: node_modules/.bin/playwright install --with-deps chromium firefox webkit

      - name: Run cross-browser preview smoke test
        working-directory: packages/cli
        run: node_modules/.bin/playwright test -c tests/compat/playwright.config.ts
        env:
          # Surface each webServer's spawn/readiness/exit (incl. exit code) so
          # a bare "Process from config.webServer exited early" is diagnosable
          # from the job log instead of unreproducible-flake guesswork.
          DEBUG: "pw:webserver"
