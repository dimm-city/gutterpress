name: Pages

# Publishes the project site in website/ to GitHub Pages on every merge to
# main. The repository's Pages source is "GitHub Actions", so this workflow's
# deploy job is the publish step; nothing is committed to a branch.
#
# The site is built by unify (https://github.com/fwdslsh/unify) on its docs
# template, laid out like unify's own documentation site: website/package.json
# pins both, and website/scripts/gen.mjs publishes the user guide
# (examples/gutterpress-user-guide) as the site's docs/ at every build.
#
# The privacy policy is rendered from the root PRIVACY.md by
# website/scripts/gen.mjs (one source, never a copy), and Google's OAuth
# consent screen needs it at a stable public URL (ADR 0011):
#   https://gutterpress.dimm.city/privacy/

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "examples/gutterpress-user-guide/**"
      - "PRIVACY.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a queued newer deploy still runs after the current one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install unify and the docs template
        run: npm ci

      # --audit publishes nothing unless the composed site passes unify's
      # audit (titles, descriptions, one h1, broken links, orphan pages).
      # The base URL and the rest of the flags are in website/unify.yaml.
      - name: Build site
        run: npx unify build --audit --strict

      - uses: actions/configure-pages@v5

      - name: Check the privacy policy was published
        run: |
          effective=$(grep -oP '\*\*Effective date:\*\*\s*\K\S+' ../PRIVACY.md)
          grep -q "drive.file" dist/privacy/index.html
          grep -q "$effective" dist/privacy/index.html

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
