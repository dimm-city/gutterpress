# Example manifest.yaml showing source.files usage

title: "Example Book with File Ordering"
authors:
  - "Author Name"

# Specify which markdown files to include and in what order
source:
  files:
    - intro.md
    - chapter-01.md
    - chapter-02.md
    - chapter-03.md
    - appendix.md
  assets:
    - css
    - fonts
    - images

output:
  dir: dist
  filename: book.pdf
  html: book.html

styles:
  - css/print.css
  - css/custom.css

page:
  width: 621
  height: 810

pdfx:
  flavor: x1a
  icc: profiles/CGATS21_CRPC1.icc
  stripAnnotations: true

# Note: If you omit the 'source.files' section or set it to null,
# the system will fall back to including all .md files in alphabetical order:
#
# source:
#   files: null  # or just omit this line
#   assets:
#     - css
#     - fonts
#     - images
