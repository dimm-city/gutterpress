<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>— Gutterpress</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- style.css is the blog template's (it imports our theme.css into its
         theme layer); stickers.css adds the site's rules to that same layer. -->
    <link rel="stylesheet" href="/assets/style.css">
    <link rel="stylesheet" href="/assets/stickers.css">
    <link rel="icon" href="/assets/icons/gutterpress-icon-light.svg" type="image/svg+xml">
    <link rel="alternate" type="application/atom+xml" title="Gutterpress news" href="/feed.xml">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Gutterpress">
    <meta name="schema" content="WebPage">
  </head>
  <body>
    <include src="/_includes/nav.html"></include>
    <main><slot></slot></main>

      <slot name="footer">
        <p>
          Gutterpress is open source, by <a href="https://github.com/dimm-city">Dimm City</a>.
          <a href="/privacy/index.html">Privacy policy</a> ·
          <a href="/feed.xml">Feed</a> ·
