# unify.yaml — saved flags for `unify build`, `audit`, `dev` and `watch`.
# The source is src/ (unify's fallback when there is no site/); the build
# writes dist/. The Pages workflow adds --base-url for the published address.

# Build on unify's built-in blog template without copying it. Its layouts,
# includes and assets sit beneath ours, and a file of ours at the same path
# wins: _layout.html, _includes/nav.html, index.html, 404.html and
# assets/theme.css (the look) are ours; assets/style.css is the template's.
# The built-in is the one shipped with the unify CLI, which the Pages
# workflow pins, so the template is pinned with it.
extends: blog

# The template's share-card placeholder is not ours to publish.
exclude:
  - _*
  - assets/share-placeholder.png

# writes blog.html, the home page's latest-posts list and privacy/index.md
# (rendered from the repository's PRIVACY.md) before every build
generate: scripts/gen.mjs

clean: true
