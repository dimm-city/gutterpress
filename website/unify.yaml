# unify.yaml — saved flags for `unify build`, `audit`, `dev` and `watch`, laid
# out like unify's own documentation site (examples/unify-docs in the unify
# repository): site/ beside scripts/gen.mjs and this file.

# Build on unify's docs template without copying it. It is installed from npm
# (package.json pins it) rather than named here by version, because
# scripts/gen.mjs imports the template's importer too, and both must read the
# same copy. Its layout, stylesheet, scripts and All-pages directory sit
# beneath site/; a file of ours at the same path replaces the template's.
extends: node_modules/unify-docs-template

# publishes the user guide as docs/, writes the docs index, the sidebar and
# the privacy page before every build
generate: scripts/gen.mjs

pretty-urls: true
base-url: https://dimm-city.github.io/gutterpress/
catalog: true
search-corpus: true

# The template's placeholder icon is not ours to publish; our share card
# replaces its share-placeholder.png at the path its layout names.
exclude:
  - _*
  - assets/favicon.svg

clean: true
