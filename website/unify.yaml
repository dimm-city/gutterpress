# unify.yaml — saved flags for `unify build`, `audit`, `dev` and `watch`.
# The source is src/ (unify's fallback when there is no site/); the build
# writes dist/. The Pages workflow adds --base-url for the published address.

# Build on unify's docs template without copying it (unify's `extends`). Its
# layout, stylesheet, scripts and All-pages directory sit beneath src/; the
# files the template names as the site's own replace its copies at the same
# path: the four _includes (head, nav, docnav, footer), assets/theme.css
# (the look) and the pages.
extends: unify-docs-template@0.4.0

# The template's placeholder icon is not ours to publish; our share card
# replaces its share-placeholder.png at the path its layout names.
exclude:
  - _*
  - assets/favicon.svg

# assets/unify/catalog.json, which the template's All-pages directory reads
catalog: true

# writes privacy/index.md from the repository's PRIVACY.md before every build
generate: scripts/gen.mjs

clean: true
