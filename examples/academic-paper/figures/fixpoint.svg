<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="468pt" height="200pt" viewBox="0 0 468 200" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="7.4">
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#333333"/>
    </marker>
  </defs>
  <style>
    .box { fill: #ffffff; stroke: #333333; stroke-width: 0.8; }
    .pre { fill: #f2f2f2; stroke: #333333; stroke-width: 0.8; stroke-dasharray: 2.5 1.5; }
    .dec { fill: #ffffff; stroke: #333333; stroke-width: 0.8; }
    .h { fill: #111111; font-weight: bold; }
    .m { fill: #444444; font-size: 6.6; }
    .t { fill: #111111; }
    .a { fill: none; stroke: #333333; stroke-width: 0.8; marker-end: url(#arr); }
  </style>

  <!-- 0. prediction -->
  <rect class="pre" x="8" y="20" width="122" height="52"/>
  <text class="h" x="69" y="32" text-anchor="middle">0. Predict (no print)</text>
  <text class="m" x="69" y="43" text-anchor="middle">second tab, same document;</text>
  <text class="m" x="69" y="52" text-anchor="middle">the viewer's own multicol layout</text>
  <text class="m" x="69" y="61" text-anchor="middle">gives id → page and a page count</text>

  <path class="a" d="M 130 46 L 150 46"/>

  <!-- 1. synthesize -->
  <rect class="box" x="150" y="20" width="122" height="52"/>
  <text class="h" x="211" y="32" text-anchor="middle">1. Synthesize from the map</text>
  <text class="m" x="211" y="43" text-anchor="middle">@counter-style symbol lists for</text>
  <text class="m" x="211" y="52" text-anchor="middle">string(), folio restarts; xref text</text>
  <text class="m" x="211" y="61" text-anchor="middle">as data-gp-after; blanks; pins</text>

  <path class="a" d="M 272 46 L 292 46"/>

  <!-- 2. print -->
  <rect class="box" x="292" y="20" width="122" height="52"/>
  <text class="h" x="353" y="32" text-anchor="middle">2. Print once</text>
  <text class="m" x="353" y="43" text-anchor="middle">Page.printToPDF over CDP:</text>
  <text class="m" x="353" y="52" text-anchor="middle">preferCSSPageSize, tagged PDF,</text>
  <text class="m" x="353" y="61" text-anchor="middle">document outline; bytes kept</text>

  <path class="a" d="M 353 72 L 353 92"/>

  <!-- 3. measure -->
  <rect class="box" x="292" y="92" width="122" height="40"/>
  <text class="h" x="353" y="104" text-anchor="middle">3. Measure from the PDF</text>
  <text class="m" x="353" y="115" text-anchor="middle">/Dests name tree: id → page for</text>
  <text class="m" x="353" y="124" text-anchor="middle">every instrumented id; page count</text>

  <path class="a" d="M 292 112 L 262 112"/>

  <!-- 4. decision -->
  <polygon class="dec" points="211,92 262,112 211,132 160,112"/>
  <text class="h" x="211" y="110" text-anchor="middle">signature equal</text>
  <text class="h" x="211" y="119" text-anchor="middle">to previous?</text>

  <!-- yes -->
  <path class="a" d="M 211 132 L 211 150"/>
  <text class="t" x="216" y="144">yes</text>
  <rect class="box" x="150" y="150" width="122" height="30"/>
  <text class="h" x="211" y="162" text-anchor="middle">Fixpoint: ship these bytes</text>
  <text class="m" x="211" y="172" text-anchor="middle">1 print when the guess held, else 2</text>

  <!-- no: loop back -->
  <path class="a" d="M 160 112 L 120 112 L 120 86 L 211 86 L 211 72"/>
  <text class="m" x="10" y="100">no: previous := signature,</text>
  <text class="m" x="10" y="109">resynthesize from the</text>
  <text class="m" x="10" y="118">measured map, reprint</text>

  <text class="m" x="8" y="188">Measurement never touches an author-visible attribute (ids the author wrote, or a zero-size &lt;gp-anchor&gt;),</text>
  <text class="m" x="8" y="197">so the measured document is the shipped document.</text>
</svg>
