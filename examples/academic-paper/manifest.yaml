title: "When Does Romberg Integration Help?"
authors:
  - "Ada Quill"
  - "Rowan Tate"

# A neutral preset with the trim set below: US Letter, 8.5 × 11 in.
preset: custom
page:
  width: 612
  height: 792

source:
  files:
    - paper.md
    - references.md

styles:
  - styles/paper.css

extensions:
  # Superscripts for author/affiliation marks: Quill^1^ (bundled, nothing to install).
  - markdown-it-sup
  # LaTeX math: $inline$ and $$display$$, typeset by MathJax as vector paths, so
  # the PDF needs no math fonts and no extra CSS. Pinned to 4.x: version 5
  # depends on a native addon, which Gutterpress does not install.
  - markdown-it-mathjax3@4.3.2
