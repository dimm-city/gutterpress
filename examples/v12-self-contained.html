# Biting Distance
Augmerc Specialty

Punishing Counter -> Rage Hit -> Bad Timing -> Pain Compliance -> It's Personal

---

## Punishing Counter | T0

> See an openin, ya take it! Best timez to pop'em iz when der relaxin back.

[0 AP] **Steel Says No:** Enemy in reach rolls tough or worse on basic attack. Shut it down. No damage. Snap back and ROLL THE DIE!

[2 AP] **Bullet to Blood:** Ranged attack rolls tough or worse. Slip the shot. No damage. Blitz if clear path and ROLL THE DIE!

## Rage Hit | T0

> In some situations, it's best to risk it, swing wild, an hit hard!

[0 AP] **Full Send:** Reckless, unsafe attack. Make it your signature. Describe the chaos and ROLL THE DIE!

[2 AP] **All Gas, No Brakes:** Two basic attacks, one target. Either roll is a 1, both catastrophically fail.

---

## Bad Timing | T0 | highlight

> Ya missed. Dat's mine now!

[2 AP] **Hard Take:** When fodder or an operator in reach rolls tough on a basic attack, parry, take no damage, and rip their weapon free.

!!! Restriction
This counter is free, does not use an action, and can only be used on targets one size smaller or bigger than you.

!!! No One's Untouchable
You can use Hard Take against a Master, but only on a catastrophe. You don't disarm them—just land the hit and deal double damage.

---

## In And Out | T1

> Blink in. Break something. Blink back.

[0 AP] Flicker to a new position adjacent to a target already in reach (their flank, rear, or above), then make a basic attack with Lucidity.

[1-X AP] Compress space, bend probability, or burn speed in a hard burst. Choose a target you can see in range. Instantly move into reach, make a basic attack with Lucidity, and snap back to starting position.

| Distance | AP Cost |
|----------|---------|
| Nearby   | 1 AP    |
| In Range | 2 AP    |
| Too Far  | 4 AP    |

!!! Requires
Line of sight to the target.

| Roll  | Outcome |
|-------|---------|
| 20    | Quadruple damage (or double a special weapon's damage). |
| 11–19 | Double damage. |
| 6–10  | Double damage to target, but they counter with a basic attack. |
| 2–5   | Miss. Target counters with a Lucid basic attack dealing 1 extra damage. |
| 1     | Prone, lose next turn. Target counters with Lucid basic attack dealing double damage. |
