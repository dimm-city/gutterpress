title: "Validation Example"
authors:
  - "Gutterpress Team"

styles:
  - styles/main.css

# Only the book itself; this folder's README.md is documentation, not a page.
chapters:
  - chapter-01.md
  - chapter-02.md

# How the book is designed: the DriveThruRPG print-on-demand preset.
preset: dtrpg

# Where it will be published: each target is a destination's validation
# policy, so one source can be checked for several destinations in one run
# (e.g. [dtrpg, itch] validates print AND digital). `--target` on the CLI
# overrides this list for a single run.
targets:
  - dtrpg

# Page validation bounds (DTRPG standard letter-with-bleed). These match the
# preset default — kept explicit here for demonstration; your own values
# always win over the preset's.
page:
  width: 621
  height: 810

# ---------- Validation Configuration ----------
# This section demonstrates all validation options.
# When omitted, the preset's defaults apply automatically.
#
# Missing external tools are detected automatically before checks run.
# Checks whose tools aren't installed are skipped with a warning.
# Disabled checks (below) suppress the missing-tool warning entirely.

# Per-check levels: off, on, info, warn or error, keyed by check id. The
# numbers the checks measure against (image resolution, ink coverage, the
# safe area) come from the preset and the publish targets.
checks:
  # Switch a check off
  pdf.structure.qpdf: off
  # Report a check's findings as info instead of warnings
  heuristic.whitespace.text-density: info
  # Switch on a check the preset leaves off
  pdf.nav.bookmarks: warn

# The markdownlint and HTMLHint checks read .markdownlint.yaml and .htmlhintrc,
# found by name in this folder (or a folder above it, up to the repository).
