title: "Dimm City — Design Guide"
authors:
  - "IT Lackey"

# Dimm City plugin: @skill, @specialty, @learning-path markers
plugins:
  - path: "plugins/dimm-city-plugin.js"
    priority: 100

# DC brand stylesheet (shared tokens → page-rules → guide overrides)
styles:
  - css/index.css

source:
  files:
    - 00-toc.md
    - 00-overview.md
    - 01-typography.md
    - 02-palette.md
    - 03-components.md
    - 04-dc-components.md
    - 05-page-templates.md
    - 06-layout.md
    - 07-markdown-reference.md
    - 08-field-guide-components.md
    - 200-fg-specialty-overview.md
    - 201-fg-specialty-profile.md
    - 202-fg-rules-spreads.md
    - 101-publishing.md
  assets:
    - css
    - fonts
    - img
    - plugins

# US Letter trim size (8.5 × 11 in = 612 × 792 pt) — drives print-md validation bounds.
# NOTE: The @page CSS uses 8.625 × 11.25 in (Letter + bleed) for DTRPG POD output.
# These differ intentionally: manifest = validation tolerance, CSS = actual PDF size.
page:
  width: 612
  height: 792
  tolerance: 0.5
