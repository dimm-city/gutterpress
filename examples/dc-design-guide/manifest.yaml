title: "Dimm City — Design Guide"
authors:
  - "IT Lackey"

# Dimm City plugin: @skill, @specialty, @learning-path markers
plugins:
  - path: "plugins/dimm-city-plugin.js"
    priority: 100

# DC brand stylesheet (shared tokens → page-rules → guide overrides)
styles:
  - css/index.css

# Debugging, visual review, and design quality review tip: comment out files to isolate issues/pages/components and speed up build iterations. Search akm for print-md manifest tips.
source:
  files:
    # Part 1 — commented out for Part 2 spread review
    # - 00-toc.md
    # - 00-overview.md
    # - 01-typography.md
    # - 02-palette.md
    # - 03-components.md
    # - 04-dc-components.md
    # - 05-page-templates.md
    # - 06-layout.md
    # - 07-markdown-reference.md
    # - 08-field-guide-components.md
    # - 101-publishing.md
    # Part 2 — Field Guide in Action examples
    # - 300-example-overview.md
    # - 301-example-front-matter.md
    # - 302-example-chapter-opener.md
    # - 303-example-specialty-overview.md
    # - 304-example-specialty-profile.md
    - 305-example-rules.md
    - 306-example-dm-npcs.md
    - 307-example-gear-tech.md
  assets:
    - css
    - fonts
    - img
    - plugins

# US Letter trim size (8.5 × 11 in = 612 × 792 pt) — drives print-md validation bounds.
# NOTE: The @page CSS uses 8.625 × 11.25 in (Letter + bleed) for DTRPG POD output.
# These differ intentionally: manifest = validation tolerance, CSS = actual PDF size.
page:
  width: 612
  height: 792
  tolerance: 0.5
