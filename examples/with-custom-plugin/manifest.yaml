title: "Custom Plugin Example"
authors:
  - "print-md Examples"

# Page dimensions (letter size: 8.5" x 11")
page:
  width: 612
  height: 792
  tolerance: 0.5

# Load custom callouts plugin (local copy)
plugins:
  - path: "./plugins/callouts-plugin.js"
    priority: 100
    options:
      types: ["note", "tip", "warning", "danger", "info"]
      className: "callout"
  # Also load built-in TTRPG plugin for comparison
  - name: "ttrpg"
    priority: 50

source:
  files:
    - "introduction.md"
    - "using-callouts.md"
    - "combining-features.md"
