# Publish the companion design guide as a static site.
#
# Triggers on changes under design-guide/ — the path whose content the guide
# depends on. Builds the static site with
# `gutterpress build --format html`, which produces a directory containing the
# rendered, self-contained book HTML (book.html — CSS and fonts already
# inlined), a redirect index.html for hosts that need a default entry point,
# the page-nav/zoom scripts, and any images the guide actually references.
#
# GitHub Pages repo settings:
#   Settings → Pages → Source: GitHub Actions
#
# Azure Static Web Apps:
#   Create a Static Web App, then add
#   AZURE_STATIC_WEB_APPS_API_TOKEN
#   as a repository secret and uncomment the Azure step below.
#
# Drop this file into your book repo as
#   .github/workflows/publish-design-guide.yml
# and adjust the `working-directory` / paths if your design guide lives
# somewhere other than ./design-guide.

name: Publish design guide

on:
  push:
    branches: [main]
    paths:
      - "design-guide/**"
      - ".github/workflows/publish-design-guide.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Gutterpress (and any plugins)
        run: bun add -d gutterpress

      - name: Build the design guide as a static site
        # Produces ./design-guide-site/ containing index.html (redirects to
        # book.html), book.html (self-contained: CSS/fonts inlined),
        # preview/ (nav scripts), and any referenced images.
        run: bunx gutterpress build ./design-guide --format html --out ./design-guide-site

      # Uncomment this step to deploy the prebuilt static site to Azure
      # Static Web Apps instead of (or alongside) GitHub Pages.
      #
      # - name: Deploy to Azure Static Web Apps
      #   uses: Azure/static-web-apps-deploy@v1
      #   with:
      #     action: upload
      #     app_location: ./design-guide-site
      #     output_location: ""
      #     skip_app_build: true
      #     azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./design-guide-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
