title: My Book
authors:
  - Author Name

# The book and the companion design guide (../design-guide/) both consume the
# same stylesheet, so the guide always documents what the book actually ships.
#
# `styles:` names the stylesheet's REAL path. Gutterpress READS a stylesheet and
# inlines it into the book, so a shared stylesheet needs no copying, no asset
# list, and no "name the flattened destination instead of the source" rule.
# Fonts and images the stylesheet references resolve relative to the stylesheet
# itself and travel with it automatically.
styles:
  - ../design-guide/styles/guide.css

# Letter (8.5" x 11"). Match this to your design-guide manifest so the guide's
# screenshots and dimensions reflect the book's real page geometry.
page:
  width: 612
  height: 792
  tolerance: 0.5
