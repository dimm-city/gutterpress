# SFE-P3e Lane A: a REAL local-file plugin. `./plugins/callout.js` is a
# standard `(md, options) => void` markdown-it plugin with a default export
# (see that file's own header) — no receipt, no vendoring, no network to
# resolve it; it is the SOLE definition of the `@@callout` core rule this
# fixture's chapters exercise.
#
# `packages/desktop/electron/editor-projection.ts`'s `buildHostEditorProjection`
# (the desktop rich editor's own host-side pipeline) loads this entry
# through its own narrower, host-local loader rather than
# `packages/cli/src/lib/markdown/plugins.ts`'s `loadPlugin`/`loadPluginsWithCss`
# — see that module's header ("A CONFIRMED BLOCKER, not a design preference")
# for exactly why. The manifest shape itself is standard and unaffected: a
# real CLI build/preview against this project resolves this exact entry
# through the real loader, same as any other project.
#
# Previously (SFE-P3d-parity) this named an uninstalled npm package
# (`gutterpress-plugin-callout`) no loader could ever load — this run
# replaced that with a genuinely loadable local file specifically so
# `editor-projection-host.test.ts` and the three
# `real-book-plugin-*.test.ts` files could drive the desktop's real plugin-
# loading pipeline end to end, not a hand-built `md` instance standing in
# for it.
plugins:
  - ./plugins/callout.js
