appId: city.dimm.print-md-viewer
productName: print-md-viewer

files:
  - electron-dist/**
  - build/**
  - package.json
  - node_modules/**

extraMetadata:
  main: electron-dist/main.js

# Do not bundle node_modules into an asar archive; @dimm-city/print-md and
# its deps are resolved from node_modules at runtime.
asar: false

directories:
  output: dist
  buildResources: build-resources

linux:
  target:
    - AppImage
  category: Office

win:
  target:
    - zip
  icon: build-resources/icon.ico

mac:
  target:
    - dmg
  icon: build-resources/icon.icns
  category: public.app-category.developer-tools
