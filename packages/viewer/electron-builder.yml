appId: city.dimm.print-md-viewer
productName: print-md-viewer

files:
  - electron-dist/**
  - build/**
  - package.json
  - node_modules/**

extraMetadata:
  main: electron-dist/main.js

# asar: false because @dimm-city/print-md-lib uses import.meta.url-relative
# paths to locate assets (dist/assets/) — those paths break inside an ASAR
# archive. If the asset resolution is ever changed, ASAR can be re-enabled.
asar: false

afterPack: scripts/after-pack.cjs

directories:
  output: dist
  buildResources: build-resources

linux:
  target:
    - AppImage
  icon: build-resources/icon.png
  category: Office

win:
  target:
    - zip
  icon: build-resources/icon.ico

mac:
  target:
    - dmg
  icon: build-resources/icon.png
  category: public.app-category.developer-tools
