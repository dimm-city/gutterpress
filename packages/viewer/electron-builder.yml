appId: city.dimm.print-md-viewer
productName: print-md-viewer

# The ESM Electron main (out/main/main.js, built by electron-vite) dynamic-
# imports @dimm-city/print-md from node_modules at runtime (electron/main.ts
# loadLib()). The lib's package.json `files` field constrains what ships (dist/ +
# profiles/). electron-builder copies the lib and its transitive deps
# (puppeteer-core, markdown-it, etc.) automatically from the workspace
# node_modules via package.json `dependencies` — no manual list, no afterPack.
files:
  - out/**
  - build/**
  - package.json
  # The viewer loads @dimm-city/print-md's self-contained library entry
  # (dist/index.js) in the main process; it never runs the CLI binary (cli.js,
  # ~4.5MB) nor needs the bundled .d.ts declarations. The SPA it serves is the
  # baked build/ (above), NOT the package's ui/ (that copy is only for the npm
  # runtime download). Exclude all three from the asar.
  - "!**/node_modules/@dimm-city/print-md/dist/cli.js"
  - "!**/node_modules/@dimm-city/print-md/dist/**/*.d.ts"
  - "!**/node_modules/@dimm-city/print-md/ui/**"

extraMetadata:
  main: out/main/main.js

# The viewer depends on the private workspace lib via `"@dimm-city/print-md":
# "workspace:*"`. electron-builder must NOT run `npm install --production` during
# packaging — npm rejects the `workspace:*` protocol (EUNSUPPORTEDPROTOCOL) and
# the lib is unpublished. We rely on the already-installed (bun) workspace
# node_modules and pure-JS deps (no native addons to rebuild), so disable the
# rebuild step explicitly rather than depending on the default.
npmRebuild: false

# asar (Electron's default) — smaller, faster to scan on Windows. The lib reads
# its embedded assets (favicon, paged.polyfill, ICC) via fs from inside the
# archive, which Electron's patched fs handles. puppeteer-core is unpacked so it
# has real on-disk paths when driving system Chrome.
asar: true
asarUnpack:
  - "**/node_modules/puppeteer-core/**"

directories:
  output: dist
  buildResources: build-resources

# Native deps and large optionals are installed via the viewer's package.json
# dependencies (@dimm-city/print-md → its transitive deps). electron-builder
# copies them automatically from the workspace node_modules at packaging time.
linux:
  target:
    - AppImage
  icon: build-resources/icon.png
  category: Office

win:
  target:
    - zip
  icon: build-resources/icon.ico

mac:
  target:
    - dmg
  icon: build-resources/icon.png
  category: public.app-category.developer-tools
