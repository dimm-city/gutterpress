appId: city.dimm.print-md-viewer
productName: print-md-viewer

# The compiled Electron main (electron-dist/main.js, CJS) dynamic-imports the
# pure-ESM @dimm-city/print-md-lib from node_modules at runtime (see
# electron/main.ts loadLib()). The lib's package.json `files` field constrains
# what ships (just dist/ and profiles/). electron-builder copies the lib and
# its transitive deps (puppeteer-core, markdown-it, etc.) automatically from
# the workspace node_modules via package.json `dependencies` — no manual list,
# no afterPack hook, no separate lib bundle.
files:
  - electron-dist/**
  - build/**
  - package.json

extraMetadata:
  main: electron-dist/main.js

# asar: false because @dimm-city/print-md-lib uses import.meta.url-relative
# paths to locate assets (favicon, paged.polyfill, etc) and ASAR archives
# break that resolution. The lib bundle preserves the same import.meta.url
# pattern from inside electron-dist.
asar: false

directories:
  output: dist
  buildResources: build-resources

# Native deps and large optionals are installed via the viewer's package.json
# dependencies (@dimm-city/print-md-lib → its transitive deps). electron-builder
# copies them automatically from the workspace node_modules at packaging time.
linux:
  target:
    - AppImage
  icon: build-resources/icon.png
  category: Office

win:
  target:
    - zip
  icon: build-resources/icon.ico

mac:
  target:
    - dmg
  icon: build-resources/icon.png
  category: public.app-category.developer-tools
