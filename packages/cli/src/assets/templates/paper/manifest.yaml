title: "{{TITLE}}"
authors:
  - "{{AUTHOR}}"
language: en
source:
  files:
    - chapter-01.md
styles:
  - styles/book.css
# A paper prints on US Letter; for A4 set width 595 and height 842. Text
# stays 0.25 in (18) inside the trim.
page:
  width: 612
  height: 792
  safe: 18
extensions:
  - markdown-it-sup
  - gutterpress-math
  # The built-in academic look. Style over it from styles/book.css.
  - academic
preset: custom
