title: "{{TITLE}}"
authors:
  - "{{AUTHOR}}"
chapters:
  - chapter-01.md
styles:
  - styles/book.css
extensions:
  - technical-doc
# Page size and margins in points (72 = 1 in): US Letter (8.5 x 11 in) with
# 0.9 in top and bottom and 1 in side margins; text stays 0.25 in (18) inside
# the trim. Change them in Book setup.
page:
  width: 612
  height: 792
  safe: 18
  margin:
    top: 64.8
    bottom: 64.8
    inside: 72
    outside: 72
preset: custom
