<!--
  Safe area & bleed overlay fixture (overlay.ts). A 400x500px sheet whose
  geometry comes ONLY from the project (the preview's <meta name="gp-print-area">:
  300x375pt = 400x500px, a 9pt = 12px bleed inside the sheet on the top, bottom
  and outer edge, an 18pt = 24px safe area inside the trim), plus one element
  for each verdict the overlay can reach.

  Page 1 is a recto: trim x 0..388, y 12..488; safe area x 24..364, y 36..464.
  Page 2 is a verso: trim x 12..400; safe area x 36..376. The book's own
  mirrored @page margins put its text at x 60..360 on the recto and x 40..340 on
  the verso: they decide where the TEXT goes and nothing about the overlay.

  The book's CSS also tries to hide, move and restyle the overlay; the test
  asserts none of it lands.
-->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="gp-print-area" content='{"width":300,"height":375,"bleed":9,"safe":18}' />
    <style>
      /* MARKER_CSS + GUTTERPRESS_CSS are injected by the test, exactly as
         assemble.ts injects them into a real book. */
      @page { size: 400px 500px; margin: 40px; }
      @page :left  { margin-left: 40px; margin-right: 60px; }
      @page :right { margin-left: 60px; margin-right: 40px; }
      body { margin: 0; }
      p { margin: 0 0 6px; font: 12px/1.2 monospace; }
      .bar { display: block; height: 14px; background: #36c; margin-bottom: 8px; }

      /* A book (or a plugin) reaching for the overlay. None of this may land. */
      gp-overlay { display: none !important; transform: translate(300px, 300px) !important; opacity: 0 !important; }
      :root, body { --gp-ov-color: #ff0000; --gp-ov-width: 9px; }
      .gp-ov-safe, .gp-ov-page { display: none !important; }
      div { outline-color: #ff0000 !important; border-color: #ff0000 !important; }
    </style>
  </head>
  <body>
    <main>
      <p id="intro">Ordinary text that fits the safe area.</p>
      <!-- the text column is 300px wide (400 - 60 - 40), x 60..360 on page 1 -->
      <div class="bar" id="fits" style="width: 300px"></div>
      <div class="bar" id="into-unsafe" style="width: 320px"></div>
      <div class="bar" id="into-bleed" style="width: 335px"></div>
      <div class="bar" id="off-page" style="margin-left: -75px; width: 520px"></div>
      <div class="bar gp-behind" id="placed" style="width: 335px"></div>
      <div id="filler"></div>
      <p id="last">The last paragraph.</p>
    </main>
    <script>
      document.getElementById("filler").innerHTML = Array.from(
        { length: 44 },
        () => "<p>" + "filler ".repeat(15) + "</p>",
      ).join("");
    </script>
    <script src="gutterpress-viewer.js"></script>
  </body>
</html>
