<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @page { size: 400px 600px; margin: 40px; }
      body { margin: 0; font: 16px/20px serif; }
      .page { break-before: page; }
      .box { height: 60px; }
    </style>
  </head>
  <body>
    <main>
      <div class="chapter" id="lead-chapter"><div class="page"><div class="box">lead chapter opening</div></div></div>
      <div class="box" id="straggler-one">straggler one</div>
      <div class="chapter" id="clean-chapter"><div class="page"><div class="box">clean chapter opening</div></div></div>
      <div class="box" id="straggler-two">straggler two</div>
      <div class="chapter" id="text-chapter">intro text before the nested page
        <div class="page" id="text-page"><div class="box">text chapter page</div></div>
      </div>
    </main>
    <script src="gutterpress-viewer.js"></script>
  </body>
</html>
