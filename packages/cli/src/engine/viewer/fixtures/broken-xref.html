<!--
  Regression fixture for WP-B item 5: a `target-counter()` reference whose
  `href` doesn't match any id in the document ("#nope") must not just print
  a silent "p.?" — the viewer surfaces the same actionable broken-xref
  warning the compiler's PDF build diagnoses (`engine.xref.broken`). A
  second, VALID reference ("#real") proves resolution still works when the
  target exists. See `xref-warning.test.ts`.
-->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Broken xref</title>
<style>
@page { size: 4in 3in; margin: 0.4in; }
body { font: 12pt/1.4 Georgia, serif; margin: 0; }
a::after { content: ' p.' target-counter(attr(href), page); }
</style>
</head>
<body>
<main>
<p><a href="#nope">Broken reference</a></p>
<p><a href="#real">Working reference</a></p>
<h1 id="real">Real target</h1>
</main>
<script src="gutterpress-viewer.js"></script>
</body>
</html>
