<!--
  Regression fixture for `Gutterpress.refresh()` soundness (WP-B item 1 /
  gate doc "Gutterpress.refresh()/relayout() cannot absorb a page-context
  change"): splicing in a NEW element that carries its own `page:` name must
  be visible to a refresh, the same way it would be to a fresh reload or a
  compiler build. A refresh that only re-measures the strips built at mount
  cannot see the new page context and silently keeps the old (wrong) page
  count. See `refresh.test.ts`.
-->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Refresh splice</title>
<style>
@page { size: 4in 3in; margin: 0.4in; }
@page named { margin: 1in; }
body { font: 12pt/1.4 Georgia, serif; margin: 0; }
p { margin: 0 0 8pt; }
.on-named { page: named; background: #eee; }
</style>
</head>
<body>
<main id="root">
<p id="p1">Base content, one short paragraph — one page on its own.</p>
</main>
<script src="gutterpress-viewer.js"></script>
</body>
</html>
