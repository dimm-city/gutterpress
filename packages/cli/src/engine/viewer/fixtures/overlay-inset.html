<!--
  In-sheet bleed fixture (overlay.ts, `page.bleed`). A 400x500px SHEET with 40px
  margins and NO CSS bleed; the preview page's <meta name="gp-inset-bleed"> says
  the sheet already contains a 9pt (12px) bleed on the top, bottom and outer edge.

  Page 1 is a recto (outer edge = right: trim x 0..388), page 2 a verso (outer
  edge = left: trim x 12..400); y trim 9..491 on both. The viewer lays every
  page's text in one column, x 50..370 (see decorate.ts).
-->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="gp-inset-bleed" content="9" />
    <style>
      @page { size: 400px 500px; margin: 40px; }
      @page :left  { margin-left: 30px; margin-right: 50px; }
      @page :right { margin-left: 50px; margin-right: 30px; }
      body { margin: 0; }
      p { margin: 0 0 6px; font: 12px/1.2 monospace; }
      .brk { break-before: page; }
      .bar { display: block; height: 14px; background: #36c; margin-bottom: 8px; }
    </style>
  </head>
  <body>
    <main>
      <p id="intro">Ordinary text that fits the content area.</p>
      <!-- page 1 (recto): x 50..395 reaches past the outer (right) trim at 388 -->
      <div class="bar" id="r-outer" style="width: 345px"></div>
      <!-- x 5..105 pokes past the content edge on the binding side: the margin, not bleed -->
      <div class="bar" id="r-binding" style="margin-left: -45px; width: 100px"></div>
      <!-- page 2 (verso): x 5..105 crosses the outer (left) trim at 12 -->
      <div class="bar brk" id="v-outer" style="margin-left: -45px; width: 100px"></div>
      <!-- x 50..395 reaches the binding side: nothing is cut there, so the margin -->
      <div class="bar" id="v-binding" style="width: 345px"></div>
    </main>
    <script src="gutterpress-viewer.js"></script>
  </body>
</html>
